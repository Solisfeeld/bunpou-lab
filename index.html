/* ---------- relógio de sessão ----------
   O relógio mede TEMPO DECORRIDO da sessão, não tempo de atenção. Trocar de
   aba, de app ou minimizar o navegador NÃO pausa: um plano de 45 min é uma
   janela de 45 minutos de relógio, e o intervalo passado fora do app é
   contabilizado por inteiro quando a página volta.

   Só pausam as interrupções VOLUNTÁRIAS de dentro do próprio Bunpou Lab:
   sair da tela de sessão (Ajustes, Progresso, resultado), abrir o popover da
   conta ou um modal que bloqueia a atividade — ver clockShouldRun().

   A contagem é por tempo absoluto: cada pulso credita `Date.now() - clockLast`
   com o estado ANTERIOR e só então move clockLast. Por isso o resultado não
   depende do setInterval — se o navegador throttlar ou suspender os timers
   por 20 minutos, o pulso seguinte credita os 20 minutos de uma vez. O
   intervalo de 500 ms existe apenas para animar o mostrador. */
function fmt(s){const m=Math.floor(s/60);return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function clockShouldRun(){
  /* QUALQUER overlay bloqueante visível pausa — não só o #overlay do próprio
     index.html. O modal de conflito de sincronização é criado em auth-sync.js
     com class="overlay show" e sem id; procurar pela classe cobre os dois sem
     que a camada de autenticação precise conhecer o relógio. */
  const bloqueado=!!document.querySelector('.overlay.show');
  return !!V.run&&V.view==='run'&&!V.acctOpen&&!bloqueado;
}
function clockPulse(){
  const now=Date.now(),active=clockShouldRun();
  /* credita PRIMEIRO, com a flag antiga, e só depois reposiciona clockLast:
     inverter a ordem apagaria justamente o intervalo passado em background. */
  if(V.clockCounting&&V.clockLast) V.activeMs+=Math.max(0,now-V.clockLast);
  V.clockLast=now; V.clockCounting=active; V.clock=Math.floor(V.activeMs/1000);
  /* Prática rápida: se o alvo cai enquanto o feedback está na tela, a decisão
     “Continuar” deixa de valer — o quick nunca começa atividade após 100%.
     Fila e rótulo mudam juntos, então o botão segue dizendo a verdade. */
  if(V.graded&&V.graded.next==='continue'&&V.run&&V.run.mode==='quick'){
    const tq=quickTarget(V.run.planMin);
    if(tq&&V.activeMs/1000>=tq){
      V.softEnding=true; V.run.items=V.run.items.slice(0,V.i+1); recalcRunEstimate();
      V.graded.next='results';
      const b=document.getElementById('ctaNext'); if(b) b.textContent='Ver resultado';
    }
  }
  const el=document.getElementById('clock');
  if(el){
    el.textContent=fmt(V.clock);
    /* volta do background já estourado: o mostrador diz isso na hora */
    const alvo=V.run&&(V.run.mode==='sessao'||V.run.mode==='quick')?(V.run.planMin||V.planMin||0)*60:0;
    el.classList.toggle('over',!!alvo&&V.clock>=alvo);
  }
}
function startClock(){
  stopClock();V.clock=0;V.activeMs=0;V.clockLast=Date.now();V.clockCounting=clockShouldRun();
  V.timer=setInterval(clockPulse,500);
}
function stopClock(){clockPulse();if(V.timer){clearInterval(V.timer);V.timer=null;}V.clockCounting=false;}
/* Reconciliação imediata ao voltar. Nenhum destes eventos ZERA o intervalo
   oculto — todos passam pelo mesmo clockPulse, que o credita antes de mover
   clockLast. `pageshow` e `focus` cobrem o mobile, onde a aba pode ser
   restaurada do bfcache sem disparar visibilitychange. */
document.addEventListener('visibilitychange',clockPulse);
window.addEventListener('pageshow',clockPulse);
window.addEventListener('focus',clockPulse);

/* ---------- navegação ----------
   Pilha explícita de telas anteriores. Guarda o CONTEXTO junto com o nome da
   view (uma fonte sem `src` ou uma lição sem `unit` seria inútil ao voltar).
   Não se usa history.back(): as views trocam internamente e não geram
   entradas reais no histórico do navegador. */
const NAV_CTX=['src','unit'];
const navSnapshot=()=>{const s={view:V.view};NAV_CTX.forEach(k=>{if(V[k]!=null)s[k]=V[k];});return s;};
const sameScreen=(a,b)=>!!a&&!!b&&a.view===b.view&&a.src===b.src&&a.unit===b.unit;

function go(view,extra){
  const from=navSnapshot();
  /* Ajustes é uma tela temporária sobre a origem. `run` e `results` ficam
     deliberadamente fora da pilha normal, então o retorno delas é registrado
     à parte — sem que virem destinos comuns do Voltar. */
  if(view==='config'&&from.view==='run'&&V.run)   V.settingsReturn={view:'run'};
  else if(view==='config'&&from.view==='results') V.settingsReturn={view:'results'};
  else if(view!=='config')                        V.settingsReturn=null;
  /* as telas de sessão têm saída própria (Encerrar/Ver resultado) e não
     entram na pilha, para que Voltar nunca reabra uma sessão encerrada */
  if(from.view!=='run'&&from.view!=='results'&&from.view!==view){
    V.nav=V.nav||[];
    if(!sameScreen(V.nav[V.nav.length-1],from)) V.nav.push(from);
    if(V.nav.length>12) V.nav.shift();
  }
  V.acctOpen=false;
  Object.assign(V,{view},extra||{});
  if(view==='home') V.nav=[];          /* a home é a raiz: zera a pilha */
  window.scrollTo(0,0);render();
}
/* Volta à tela anterior restaurando o contexto dela; sem pilha, cai na home. */
function goBack(){
  const cur=navSnapshot();
  /* Descarta entradas equivalentes à tela atual antes de escolher o destino:
     sem isso, reabrir uma tela que já estava na pilha (ex.: Progresso vindo
     do resultado da sessão) faria o primeiro Voltar parecer inerte. */
  while(V.nav&&V.nav.length&&sameScreen(V.nav[V.nav.length-1],cur)) V.nav.pop();
  const prev=(V.nav&&V.nav.length)?V.nav.pop():null;
  if(!prev){ goHome(); return; }
  V.acctOpen=false;
  Object.assign(V,{view:prev.view,src:prev.src!=null?prev.src:null,
                   unit:prev.unit!=null?prev.unit:null});
  window.scrollTo(0,0);render();
}
/* Saída da tela de Ajustes. Se ela foi aberta sobre a sessão em andamento ou
   sobre o resultado dela, volta exatamente para aquela tela — apenas trocando
   a view, sem reconstruir sessão nem recalcular o resultado (o histórico já
   está protegido por V.logged). */
function exitSettings(){
  const r=V.settingsReturn;
  const backToRun     = r&&r.view==='run'&&V.run;
  const backToResults = r&&r.view==='results'&&Array.isArray(V.sessionLog);
  if(backToRun||backToResults){
    V.settingsReturn=null; V.acctOpen=false; V.view=r.view;
    window.scrollTo(0,0); render(); return;
  }
  V.settingsReturn=null;
  goBack();
}
function goHome(){stopClock();V.run=null;go('home');}

/* "Sessão ativa" não é o mesmo que "existe um V.run em memória": depois de
   terminar, o objeto continua ali para a tela de resultado. Ativa é só a
   sessão em andamento — inclusive quando Ajustes está aberto por cima dela. */
function hasActiveRun(){
  return !!V.run && (V.view==='run' ||
    (V.view==='config' && V.settingsReturn && V.settingsReturn.view==='run'));
}
/* A marca não pode abandonar uma sessão em andamento sem confirmação;
   reutiliza o confirmQuit() existente em vez de duplicar a lógica de saída. */
function brandAction(){
  if(hasActiveRun()){ confirmQuit(); return; }
  goHome();
}

/* ---------- conta / sincronização ----------
   Somente apresentação: todo o comportamento vem de window.BunpouSync.
   Sem o módulo (ex.: index.html aberto direto do disco) nada é renderizado
   e o site continua inteiro. */
const SYNC_UI={
  synced :{chip:'Sincronizado', full:'Progresso sincronizado',                  dot:'ok',  tone:''},
  loading:{chip:'Sincronizando',full:'Sincronizando…',                          dot:'warn',tone:''},
  dirty  :{chip:'Pendente',     full:'Alterações pendentes',                    dot:'warn',tone:'warn'},
  offline:{chip:'Offline',      full:'Sem conexão · salvo neste dispositivo',   dot:'warn',tone:'warn'},
  conflict:{chip:'Conflito',    full:'Conflito de sincronização',               dot:'bad', tone:'attn'},
  error  :{chip:'Erro',         full:'Erro de sincronização',                   dot:'bad', tone:'attn'},
  'auth-required':{chip:'Sessão expirada',
                   full:'Sessão expirada · entre novamente para sincronizar',   dot:'bad', tone:'attn'}
};
const syncUI=s=>SYNC_UI[s]||{chip:'—',full:'—',dot:'warn',tone:''};

function acctControl(){
  const sy=window.BunpouSync; if(!sy) return '';
  const st=sy.getState();
  /* Enquanto a autenticação não terminou de restaurar, "sem usuário" ainda
     não é informação: mostrar "Entrar" aqui faria a conta piscar deslogada a
     cada abertura — e convidaria a um login que não é necessário. */
  if(!st.authReady){
    return `<div class="acct-wrap">
      <button class="acct-btn" disabled title="Verificando sua conta…">
        <span class="sdot warn"></span>
        <span class="lbl full">Verificando…</span><span class="lbl short">…</span>
      </button></div>`;
  }
  if(!st.user||st.status==='anonymous'){
    return `<div class="acct-wrap">
      <button class="acct-btn" onclick="BunpouSync.login()"
        title="Entrar com Google para sincronizar seus dados">
        <span class="lbl full">Entrar com Google</span><span class="lbl short">Entrar</span>
      </button></div>`;
  }
  const u=syncUI(st.status);
  return `<div class="acct-wrap">
    <button class="acct-btn ${u.tone}" onclick="toggleAcct(event)"
      title="${esc(u.full)}" aria-expanded="${V.acctOpen?'true':'false'}">
      <span class="sdot ${u.dot}"></span>
      <span class="lbl full">${esc(u.chip)}</span><span class="lbl short">${esc(u.chip)}</span>
    </button>
    ${V.acctOpen?acctPopover(st,u):''}</div>`;
}
function acctPopover(st,u){
  const who=st.user.email||st.user.name||'conta conectada';
  const last=st.lastSyncedAt?new Date(st.lastSyncedAt).toLocaleString('pt-BR'):'ainda não sincronizado';
  let actions;
  if(st.status==='auth-required')
    actions=`<button class="btn btn-primary" onclick="BunpouSync.login()">Entrar novamente com Google</button>`;
  else if(st.status==='conflict')
    actions=`<button class="btn btn-shu" onclick="BunpouSync.resolveConflict()">Resolver conflito</button>`;
  else
    actions=`<button class="btn" onclick="BunpouSync.syncNow()">Sincronizar agora</button>`;
  return `<div class="acct-pop" onclick="event.stopPropagation()">
    <div class="st"><span class="sdot ${u.dot}"></span>${esc(u.full)}</div>
    <div class="who">${esc(who)}</div>
    <div class="meta">Último envio: ${esc(last)}</div>
    ${actions}
    <div class="sep"></div>
    <button class="btn btn-ghost" onclick="BunpouSync.logout()">Sair desta conta</button>
  </div>`;
}
function toggleAcct(ev){ ev.stopPropagation(); V.acctOpen=!V.acctOpen; render(); }
function confirmQuit(){
  openModal('Sair da sessão?','O que você respondeu até agora já foi salvo. As questões restantes serão descartadas.',
    'Sair',()=>{stopClock();V.run=null;go('home');},'Continuar');
}

/* ---------- estatísticas por fonte ---------- */
function srcStats(sid){
  const gs=GRAMMAR.filter(g=>gpInSource(g,sid));
  const on=gs.filter(g=>g.src.some(([s,u])=>s===sid&&unitOn(s,u))&&gpHasPractice(g.id));
  let cons=0,fracos=0,apre=0;
  on.forEach(g=>{const st=stateOf(g.id);
    if(st==='consolidado'||st==='forte')cons++;
    else if(st==='fraco')fracos++;
    else if(st!=='novo')apre++;});
  const lim=Array.isArray(S.cfg.manual[sid])?S.cfg.manual[sid].length:(S.cfg.lim[sid]||0);
  return {total:gs.length,on:on.length,cons,fracos,apre,lim,units:unitCount(sid)};
}

/* ---------- RIKAI: agrupamento VISUAL ----------
   Introdutório e Básico 1 são a mesma coleção, então a Home mostra um card só.
   Não existe fonte lógica `rikai`: g.src, elegibilidade, filtros, Ajustes,
   limites, proveniência e tags continuam em 'intro' e 'basico'. A barra
   agregada é calculada sobre a UNIÃO dos pontos ativos das duas fontes — um
   ponto ensinado nas duas conta uma vez — e não pela média das porcentagens. */
const RIKAI_SRCS=['intro','basico'];
const RIKAI_TITLE={intro:'Introdutório Rikai',basico:'Básico 1 Rikai'};
function srcOnGrammar(sid){
  return GRAMMAR.filter(g=>gpInSource(g,sid)&&g.src.some(([s,u])=>s===sid&&unitOn(s,u))&&gpHasPractice(g.id));
}
function rikaiStats(){

          off:RIKAI_SRCS.every(sid=>!S.cfg.src[sid])};
}

function startRun(run,label,planMin){
  if(!run||!run.items.length){toast('Nenhuma atividade disponível com esses filtros.');return;}
  V.run=run; V.runLabel=label||''; V.i=0; V.ans=null; V.graded=null;
  V.sessionLog=[]; V.requeue=[]; V.logged=false; V.planMin=planMin||null;
  V.stageStarted={};V.stageVisited={};V.softEnding=false;V.topUps=0;
  V.ordView=null;V.ordViewFor=null;V.starView=null;V.starViewFor=null;V.guessSnap=null;
  dedupeRun();
  startClock();go('run');
}
function startSession(){
  /* ordem importa: sem conteúdo elegível não se abre sessão; e a sessão é
     aberta ANTES de montar, para que isDue() já enxergue o S.ses atual. */
  if(!practiceGrammar().length){toast('Libere ao menos uma lição em Ajustes.');return;}
  beginSession();                          /* mesma regra temporal das demais práticas */
  const dur=sessionMin();
  const r=buildSession({mode:'sessao',duration:dur});
  if(!r){toast('Libere ao menos uma lição em Ajustes.');return;}
  startRun(r,'Sessão de gramática',dur);
  /* honesto quando o conteúdo liberado ainda não preenche o plano escolhido */
  const est=Math.round((r.estSec||0)/60);
  if(est<dur*0.7) toast('Conteúdo liberado rende ≈'+est+' min. Libere mais lições em Ajustes.');
}

/* Prática exclusiva das provas marcadas. `sxOnly` garante que nenhuma atividade
   geral do Rikai/NNK/TRY entre aqui. A fila leva TODAS as atividades das provas
   marcadas, não uma amostra: por isso monta o run direto em vez de passar por
   buildPractice, que corta por "frescor" (com 8+ itens usa só os não vistos
   recentemente) e devolveria menos que o total. A ordem segue sorteada. */
function startProvasPractice(){
  if(!S.cfg.src[SRC_PROVAS]){toast('Ative “Workbook e provas JLPT” em Ajustes.');return;}
  const pool=poolFor(practiceGrammar().map(g=>g.id),{sxOnly:SRC_PROVAS});
  if(!pool.length){toast('Marque ao menos um conjunto em Ajustes.');return;}
  const ex=pool.slice();
  for(let i=ex.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ex[i],ex[j]]=[ex[j],ex[i]];}
  const run={items:ex.map(x=>({stage:-1,ex:x,gid:primaryGids(x)[0]})),
             started:Date.now(),mode:'provas',estSec:0};
  run.estSec=run.items.reduce((a,i)=>a+costOf(i.ex),0);
  beginSession(); startRun(run,'Workbook e provas JLPT');
}
/* ---------- Mini JLPT — Gramática ----------
   Versão curta da seção de gramática da prova (2013/07: 16 escolhas, 5 ★ e 5
   decisões num texto). Em vez de um sorteio uniforme — que saía sem ★ ou sem
   texto em boa parte das execuções —, há cota por formato:
   10 mc + 3 ★ + 1 texto com lacunas = 14 telas. `order` não entra: é montagem
   guiada por tradução, não o formato ★ da prova (hoje inativo em toda a prática).
   A elegibilidade é a mesma de sempre: practiceGrammar + poolFor com a guarda
   curricular. Nada bloqueado entra para completar cota. */
const MINI_QUOTA={mc:10,star:3,cloze:1};
const MINI_SCREENS=14;
const MINI_GID_CAP=2;       /* aparições do mesmo ponto na execução inteira */
const MINI_PROVAS_CAP=3;    /* telas de Provas antigas por execução */
/* pontos realmente cobrados: no cloze, cada lacuna conta; nos demais, pg
   quando existe (mesma regra da proveniência) */
const miniGids=x=>x.t==='cloze'?x.bl.map(b=>b.g).filter(id=>GMAP[id]):coverGids(x);
function buildMiniJlpt(){
  const elig=practiceGrammar().map(g=>g.id);
  if(!elig.length) return null;
  const pool=poolFor(elig,{types:['mc','star','cloze'],curricular:true});
  const seen=new Set(); elig.forEach(g=>recentlyUsed(g).forEach(i=>seen.add(i)));
  const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  const byT={}; ['mc','star','cloze'].forEach(t=>byT[t]=shuf(pool.filter(x=>x.t===t)));
  const sel=[],used=new Set(),perG={}; let provas=0;
  const fits=(x,cap,pvCap)=>{
    if(used.has(x.id)) return false;
    if(x.sx===SRC_PROVAS&&provas>=pvCap) return false;
    const c={};
    for(const id of miniGids(x)){ c[id]=(c[id]||0)+1; if((perG[id]||0)+c[id]>cap) return false; }
    return true;
  };
  const take=x=>{ sel.push(x); used.add(x.id); if(x.sx===SRC_PROVAS) provas++;
                  miniGids(x).forEach(id=>perG[id]=(perG[id]||0)+1); };
  /* Uma vaga do formato t. Relaxa só o necessário, nesta ordem: aceita item
     recente → aceita mais uma tela de prova → sobe o teto por ponto um degrau
     (e recomeça). A cota do formato só é dada como perdida quando nem assim
     sobra candidato. */
  const fill=t=>{
    const all=byT[t]; if(!all.length) return false;
    const fresh=all.filter(x=>!seen.has(x.id));
    for(let cap=MINI_GID_CAP;cap<=MINI_GID_CAP+MINI_SCREENS;cap++)
      for(const pvCap of [MINI_PROVAS_CAP,Infinity])
        for(const src of [fresh,all]){
          const x=src.find(e=>fits(e,cap,pvCap));
          if(x){ take(x); return true; }
        }
    return false;
  };
  /* formatos mais escassos primeiro, para o teto por ponto pesar sobre o mc */
  const got={cloze:0,star:0,mc:0};
  for(let k=0;k<MINI_QUOTA.cloze;k++) if(fill('cloze')) got.cloze++;
  for(let k=0;k<MINI_QUOTA.star;k++)  if(fill('star'))  got.star++;
  /* mc cobre a própria cota e o que faltou de ★/texto (nunca order) */
  const mcWant=MINI_SCREENS-got.cloze-got.star;
  for(let k=0;k<mcWant;k++){ if(fill('mc')) got.mc++; else break; }
  /* faltou mc: completa com ★ adicional elegível */
  while(sel.length<MINI_SCREENS&&fill('star')) got.star++;
  if(!sel.length) return null;
  const notes=[];
  const nStar=byT.star.length;
  if(nStar<MINI_QUOTA.star) notes.push(nStar===0?'Nenhuma questão ★ estava disponível com os filtros atuais.'
    :nStar===1?'Somente 1 questão ★ estava disponível com os filtros atuais.'
    :`Somente ${nStar} questões ★ estavam disponíveis com os filtros atuais.`);
  if(!byT.cloze.length) notes.push('Nenhuma questão de gramática textual estava disponível com os filtros atuais.');
  if(sel.length<MINI_SCREENS) notes.push(`Só havia ${sel.length} ${sel.length===1?'questão disponível':'questões disponíveis'} com os filtros atuais.`);
  /* as telas saem misturadas; a composição por formato fica preservada.
     Um sorteio que deixe cada formato num bloco só (≈0,15%) é refeito. */
  const blocos=a=>{let m=0;for(let i=1;i<a.length;i++) if(a[i].t!==a[i-1].t) m++;
                   return m===new Set(a.map(x=>x.t)).size-1;};
  let ordem=shuf(sel);
  for(let k=0;k<10&&new Set(sel.map(x=>x.t)).size>1&&blocos(ordem);k++) ordem=shuf(sel);
  const items=ordem.map(x=>({stage:-1,ex:x,gid:primaryGids(x)[0]}));
  const estSec=items.reduce((a,i)=>a+costOf(i.ex),0);
  return {items,started:Date.now(),mode:'jlpt',estSec,notes};
}
function startJlpt(){
  beginSession();
  startRun(buildMiniJlpt(),'Mini JLPT — Gramática');
}

const cur=()=>V.run&&V.run.items[V.i];
const quickRun=()=>!!(V.run&&V.run.mode==='quick');
function stageOf(it){ return it&&it.stage>=0?STAGES[it.stage]:null; }
function recalcRunEstimate(){
  if(V.run) V.run.estSec=V.run.items.reduce((a,i)=>a+(i.ex?costOf(i.ex):(i.budget||0)),0);
}
function markStageStart(it){
  if(!it||it.stage<0||V.stageStarted[it.stage]!=null)return;
  clockPulse();V.stageStarted[it.stage]=V.activeMs;
}
/* O corte só acontece ENTRE atividades. A questão atual e o tempo gasto
   lendo seu feedback sempre terminam; depois, o restante superestimado da
   etapa é descartado. Entre 95% e 100% do alvo sobra no máximo uma atividade
   de cada etapa ainda não visitada; a partir de 100% não sobra nenhuma. */
/* HARD_STOP deixou de poder cortar fila: 15/30/45/60 é o alvo que DIMENSIONA
   a sessão, não uma guilhotina. Continua existindo como trava de GERAÇÃO —
   nada novo nasce acima dele — e o portão prático é TOPUP_BELOW, mais
   restritivo. Trabalho já colocado na fila é do usuário e ele termina. */
/* TOPUP_BELOW é o portão: acima dele a fila vazia simplesmente encerra.
   Aferido por simulação — com 0.85 as sessões paravam em 86–90% do plano,
   abaixo das faixas desejadas; 0.92 entrega 93–95% com máximo em 98%,
   ainda bem longe do teto de 115%. */
const HARD_STOP=1.15, TOPUP_BELOW=0.92, TOPUP_FILL_TO=0.95;
/* O corte real é o relógio (TOPUP_BELOW) e o esgotamento de material; estes
   dois números existem só para impedir laço infinito, então são folgados. */
const TOPUP_MAX_ROUNDS=40, TOPUP_BATCH=6;

function trimTimedSession(){
  if(!V.run||V.run.mode!=='sessao')return;
  clockPulse();
  const nowSec=V.activeMs/1000,it=cur();if(!it)return;
  const hardTarget=(V.run.planMin||V.planMin||0)*60;
  /* 100% do plano: a fila CONGELA exatamente como está. Nada é acrescentado
     (topUpSession recusa) e — esta é a mudança — nada é DESCARTADO. As
     questões que já pertenciam a V.run.items antes do alvo continuam lá e o
     usuário as termina no ritmo dele; a sessão só vai a resultados quando a
     fila acabar. O critério é “já pertencia à fila”, não “já apareceu na
     tela”. Sair antes disso continua sendo decisão do usuário, pelo
     confirmQuit. */
  if(hardTarget&&nowSec>=hardTarget){ V.softEnding=true; return; }
  let future=V.run.items.slice(V.i+1);
  const stageBudget=V.run.stageBudgetsSec&&V.run.stageBudgetsSec[it.stage];
  const began=V.stageStarted[it.stage];
  if(stageBudget!=null&&began!=null&&(V.activeMs-began)/1000>=stageBudget)
    future=future.filter(q=>q.stage!==it.stage);
  const target=(V.run.planMin||V.planMin||0)*60;
  const nextSame=future.find(q=>q.stage===it.stage&&q.ex);
  /* Perto do alvo, não começa outra questão longa da mesma etapa só porque
     ela ainda estava na fila estimada; preserva as etapas ainda não vistas. */
  if(target&&nextSame&&nowSec+costOf(nextSame.ex)>target*.95)
    future=future.filter(q=>q.stage!==it.stage);
  if(target&&nowSec>=target*.95){
    V.softEnding=true;
    const missing=STAGES.map((s,i)=>i).filter(i=>!V.stageVisited[i]);
    if(!missing.length) future=[];
    else {
      const one=[];
      missing.forEach(si=>{const q=future.find(x=>x.stage===si);if(q)one.push(q);});
      future=one;
    }
  }
  V.run.items=V.run.items.slice(0,V.i+1).concat(future);
  recalcRunEstimate();
}

/* ---- reabastecimento guiado pelo TEMPO REAL ------------------------------
   COST dimensiona a fila inicial, mas superestima quem responde rápido: a fila
   acabava com metade do plano por gastar. Aqui o relógio da sessão é a autoridade.
   Só age quando a fila REALMENTE terminou e ainda falta muito tempo; o tamanho
   do lote vem do ritmo observado nesta sessão, não de COST. Os itens entram na
   etapa de consolidação já visitada — não existe “sexta etapa”.            */
function topUpSession(){
  if(!V.run||V.run.mode!=='sessao')return false;
  const target=(V.run.planMin||V.planMin||0)*60;
  if(!target)return false;
  clockPulse();
  const now=V.activeMs/1000;
  if(now>=target*TOPUP_BELOW)return false;             /* perto do alvo: encerra */
  if(now>=target*HARD_STOP)return false;               /* trava absoluta de geração */
  if((V.topUps||0)>=TOPUP_MAX_ROUNDS)return false;     /* guarda anti-laço */

  const answered=new Set(V.sessionLog.map(r=>r.exId)).size;
  const pace=answered?Math.max(15,now/answered):45;    /* s/atividade REAIS */
  const slots=Math.max(1,Math.min(TOPUP_BATCH,
                Math.ceil((target*TOPUP_FILL_TO-now)/pace)));

  const elig=practiceGrammar();
  if(!elig.length)return false;
  const byUrgency=elig.slice().sort((a,b)=>weakScore(b.id)-weakScore(a.id));
  const due=byUrgency.filter(g=>isDue(g.id));
  const fresh=elig.filter(g=>!S.gp[g.id]||!S.gp[g.id].seen);
  /* mesma prioridade das etapas 2–4: devidos/fracos → novos → vistos */
  const cand=stageCandidates({k:'top'},elig,byUrgency,due,fresh);

  const used=new Set(V.run.items.filter(i=>i.ex).map(i=>i.ex.id));
  const perGid={};
  V.run.items.forEach(i=>{ if(i.ex&&i.gid) perGid[i.gid]=(perGid[i.gid]||0)+1; });
  const stg=STAGES.length-1;                           /* consolidação */
  const add=[];
  for(let relax=0;relax<2&&add.length<slots;relax++){
    for(const g of cand){
      if(add.length>=slots)break;
      if(!relax&&(perGid[g.id]||0)>=GID_SOFT_CAP)continue;
      const pool=poolFor([g.id],{curricular:true}).filter(x=>!used.has(x.id)&&x.t!=='cloze');
      if(!pool.length)continue;
      const x=pickEx(pool,recentlyUsed(g.id));
      if(!x)continue;
      used.add(x.id); perGid[g.id]=(perGid[g.id]||0)+1;
      add.push({stage:stg,ex:x,gid:g.id,topup:true});
    }
  }
  if(!add.length)return false;
  V.topUps=(V.topUps||0)+1;
  V.run.items=V.run.items.concat(add);
  recalcRunEstimate();
  return true;
}

/* ---- barra de progresso da sessão ---- */
/* Aviso de prática sem conta. Só afirma “sem login” depois que a autenticação
   terminou de restaurar (authReady) — antes disso ainda não se sabe. Sem o
   módulo de sync (arquivo aberto do disco) não se afirma nada. NÃO é V.logged:
   aquele é só o controle de gravação do histórico da sessão. O contêiner
   #authnote existe sempre, para ser atualizado quando o auth ficar pronto. */
function authNoteHtml(){
  const sy=window.BunpouSync;
  const st=sy?sy.getState():null;
  if(!st||!st.authReady||st.user) return '<div id="authnote"></div>';
  return '<div id="authnote" class="authnote">Praticando sem login: o progresso fica salvo só neste navegador e não é sincronizado.</div>';
}
function sessBar(){
  const it=cur(),st=stageOf(it);
  const total=V.run.items.length,done=V.i;
  const dots=V.run.mode==='sessao'?`<div class="stage-dots">${STAGES.map((s,i)=>
     `<i class="${it&&it.stage===i?'on':(it&&i<it.stage?'done':'')}"></i>`).join('')}</div>`:'';
  const est=Math.round((V.run.estSec||0)/60);
  const timing=(V.run.mode==='sessao'||V.run.mode==='quick')&&V.run.planMin?
    ` · alvo ${V.run.planMin} min`:(est?` · ≈${est} min`:'');
  return `<div class="sessbar">
    <div class="pbar"><i style="width:${Math.round(done/total*100)}%"></i></div>
    ${dots}<span class="muted">${done+1}/${total}${timing}</span>
    ${V.softEnding&&V.run.mode==='sessao'?
      '<div class="muted" style="margin-top:6px">Alvo atingido · finalize as questões restantes.</div>':''}</div>
   ${authNoteHtml()}
   ${st?`<div style="margin-bottom:14px"><b>Etapa ${it.stage+1} · ${st.n}</b>
     <div class="muted">${st.d}</div></div>`:
    (V.runLabel?`<div style="margin-bottom:14px"><b>${esc(V.runLabel)}</b>${
      V.run.notes&&V.run.notes.length?`<div class="muted">${V.run.notes.map(esc).join(' ')}</div>`:''}</div>`:'')}`;
}

/* Estado VISUAL de uma alternativa de mc/★ (i e correct no mesmo índice que
   V.ans usa). Só lê o que finish()/markGuess() já registraram em V.graded —
   não decide nada de SRS. Antes da correção, só a seleção azul de sempre.
   Depois: a correta fica sempre marcada; a escolha errada só em erro de
   verdade (em “Não sei” nada é pintado de erro, mesmo que houvesse uma
   alternativa selecionada); o chute mantém a correta e ganha o selo. */
function optState(i,correct){
  const g=V.graded;
  if(!g) return {cls:V.ans===i?'sel':'',mark:''};
  const res=g.res, mine=V.ans===i&&res!=='idk', right=i===correct;
  if(right){
    const txt=res==='idk'?'✓ Resposta correta':(mine?'✓ Sua resposta · correta':'✓ Correta');
    return {cls:'right'+(res==='guess'?' guess':''),
      mark:`<span class="omark">${txt}${res==='guess'?'<span class="chute">chute</span>':''}</span>`};
  }
  if(mine&&res==='bad') return {cls:'wrong',mark:'<span class="omark">✗ Sua escolha</span>'};
  return {cls:'',mark:''};
}

/* ---- render de uma atividade ---- */
function renderRun(){
  const it=cur();
  if(!it){ stopClock(); V.view='results'; return renderResults(); }
  if(it.placeholder){ fillStage5(); return renderRun(); }
  markStageStart(it);
  const x=it.ex,g=primaryGrammars(x,it.gid)[0]||GMAP[it.gid];
  const gl=x.gl?`<div class="gloss">${Object.entries(x.gl).map(([k,v])=>
      `<code class="jp">${esc(k)}</code> = ${esc(v)}`).join(' · ')}</div>`:'';
  let body='';
  if(x.t==='mc'){
    body=`<div class="opts">${x.o.map((o,i)=>{const st=optState(i,x.a);
      return `<button class="opt ${st.cls}" ${V.graded?'disabled':''} onclick="pick(${i})">
        <span class="k">${'ABCD'[i]}</span><span class="jp">${esc(o)}</span>${st.mark}</button>`;}).join('')}</div>`;
  } else if(x.t==='order'){
    const a=V.ans||[], pool=ordTokens(x), view=orderView(x);
    body=`<div class="slot">${a.map((idx,pos)=>
        `<button class="tok placed jp" ${V.graded?'disabled':''} onclick="ordDel(${pos})">${esc(pool[idx])}</button>`).join('')}</div>
      <div class="tokens">${view.map(i=>a.includes(i)?'':
        `<button class="tok jp" ${V.graded?'disabled':''} onclick="ordAdd(${i})">${esc(pool[i])}</button>`).join('')}</div>`;
  } else if(x.t==='cloze'){
    const a=V.ans||[];
    const parts=V.graded&&V.graded.parts;
    /* o texto: cada ｛n｝ vira um marcador numerado que mostra a escolha atual */
    const txt=esc(x.tx).replace(/\n/g,'<br>').replace(/｛(\d+)｝/g,(m,n)=>{
      const i=+n-1, sel=a[i];
      const st=parts?(parts[i].ok?'cz-ok':'cz-bad'):(sel!=null?'cz-set':'');
      return `<b class="czslot ${st}" data-b="${i}">${n}<span>${sel!=null?esc(x.bl[i].o[sel]):'　　'}</span></b>`;
    });
    body=`<div class="cztext jp">${txt}</div>
      <div class="czblanks">${x.bl.map((b,i)=>`
        <div class="czb">
          <div class="czb-h"><span class="czn">${i+1}</span>${
            parts?`<span class="czv ${parts[i].ok?'good':'bad'}">${parts[i].ok?'✓':'✗'}</span>`:''}</div>
          <div class="opts czopts">${b.o.map((o,j)=>
            `<button class="opt ${a[i]===j?'sel':''} ${parts&&j===b.a?'right':''} ${parts&&a[i]===j&&!parts[i].ok?'wrong':''}"
              ${V.graded?'disabled':''} onclick="czPick(${i},${j})">
              <span class="k">${'ABCD'[j]}</span><span class="jp">${esc(o)}</span></button>`).join('')}</div>
        </div>`).join('')}</div>`;
  } else if(x.t==='star'){
    const a=V.ans;
    const sv=starView(x);   /* posição visível → índice original em tk */
    body=`<div class="startx jp">${starText(x.pre)}${
        x.ord.map((_,pos)=>`<span class="stslot${pos===x.star?' on':''}">${pos===x.star?'★':'＿＿'}</span>`).join('')
      }${starText(x.post)}</div>
      <div class="muted" style="margin:10px 0 4px">Monte a frase mentalmente. Qual fragmento fica na posição ★?</div>
      <div class="opts">${sv.map((i,p)=>{const st=optState(i,x.ord[x.star]);
        return `<button class="opt ${st.cls}"
          ${V.graded?'disabled':''} onclick="pick(${i})">
          <span class="k">${p+1}</span><span class="jp">${esc(x.tk[i])}</span>${st.mark}</button>`;}).join('')}</div>`;
  } else {
    /* Todos os tipos escritos (fill · trans · correct · prod) cabem numa linha:
       a resposta mais longa do banco tem 29 caracteres. Um único campo dá a
       mesma borda, altura, fonte, foco e comportamento a todos — prod e correct
       usavam textarea sem necessidade.

       A legenda é por TIPO, não pela presença de （　） no enunciado: os 31
       `fill` esperam só o trecho da lacuna (gabaritos de 1 a 7 caracteres),
       enquanto x477 é um `trans` que também mostra （　） mas pede a resposta
       inteira. Ela aparece antes de responder, não como dica. */
    const note=x.t==='fill'
      ?'<div class="innote">Digite somente o que falta na lacuna.</div>':'';
    body=`${note}<input class="tin jp" id="inp" ${V.graded?'disabled':''} autocomplete="off" autocapitalize="off"
        placeholder="${x.t==='fill'?'só o que falta':'sua resposta'}" value="${esc(V.ans||'')}"
        oninput="V.ans=this.value" onkeydown="ansKey(event)">`;
  }
  /* Sem botão de dica: o caminho de aprendizagem é “Não sei”, que registra a
     dúvida e abre a explicação completa. Os campos `h` continuam no banco. */

  return `<div class="wrap"><div style="padding:20px 0 0">${sessBar()}
    <div class="qcard">
      <div class="qtop">
        <span class="chip skill">${({rec:'reconhecer',dif:'diferenciar',man:'manipular',pro:'produzir',rcl:'recuperar',mix:'gramática em discurso'})[x.s]||x.s}</span>
        ${(()=>{const oi=exOriginInfo(x); if(!oi) return '';
          return `<span class="ori-wrap"><button type="button" class="chip src-${oi.src} ori" aria-expanded="false"
            aria-haspopup="dialog" onclick="toggleOrigin(event,this)">${esc(oi.label)}</button>
            <span class="ori-pop" role="dialog" hidden>
              <span class="ori-k">Origem da atividade</span>${esc(oi.name)}
              ${oi.loc?`<span class="ori-k">Localização</span>${esc(oi.loc)}`:''}
              ${oi.cov&&oi.cov.length?`<span class="ori-k">Onde estudar este conteúdo</span>${
                oi.cov.map(c=>esc(c)).join('<br>')}`:''}
            </span></span>`;})()}
        ${exIsContrast(x)?`<span class="chip jp">${esc(CMAP[x.g].t)}</span>`:''}
        ${V.graded?`<span class="chip src-${(g&&g.src[0][0])||'intro'}">${esc(g?g.t:'')}</span>`:''}
      </div>
      <div class="qprompt jp">${x.p}</div>
      ${gl}
      ${body}
      ${V.graded?feedbackHtml(x,g):`
      <div class="row" style="margin-top:18px">
        <button class="btn btn-primary" onclick="submit()">Responder</button>
        <button class="btn btn-ghost" onclick="dontKnow()">Não sei</button>
      </div>`}
    </div>
    ${V.graded?`<div class="row" style="margin-top:16px">
       <button class="btn btn-primary" id="ctaNext" onclick="next()">${V.graded.next==='results'?'Ver resultado':'Continuar'}</button>
       ${canGuess(x)?`<button class="btn btn-ghost" onclick="markGuess()"
          title="Acertei, mas não tinha certeza — ver a explicação">Chutei</button>`:''}
     </div>
     ${V.chatFallback&&V.chatFallback.i===V.i?`<div class="chat-fallback">
       <div class="muted">Não foi possível copiar automaticamente. Selecione o texto abaixo, copie e cole no
         <a href="${CHAT_URL}" target="_blank" rel="noopener">ChatGPT</a>.</div>
       <textarea readonly onfocus="this.select()">${esc(V.chatFallback.txt)}</textarea></div>`:''}`:''}
    <!-- Sem btn-sm: era o único controle da tela de prática com a variante
         reduzida (padding 6/12 · 14px→12.5px · raio 8), o que o fazia parecer
         de outro sistema visual. Segue secundário pelo btn-ghost. -->
    <div class="foot"><button class="btn btn-ghost" onclick="confirmQuit()">Encerrar sessão</button></div>
  </div></div>`;
}

/* Só depois de um acerto, e uma vez por atividade. Fora daí (erro, “não sei”,
   chute já marcado, cloze) o botão não aparece. */
function canGuess(x){
  return !!V.graded&&V.graded.res==='ok'&&!V.graded.guessed&&x&&x.t!=='cloze';
}
function pick(i){ if(V.graded)return; V.ans=i; render(); }
function czPick(b,j){ if(V.graded)return; const a=(V.ans||[]).slice(); a[b]=j; V.ans=a; render(); }
function ordAdd(i){ if(V.graded)return; V.ans=(V.ans||[]).concat([i]); render(); }
function ordDel(p){ if(V.graded)return; const a=(V.ans||[]).slice(); a.splice(p,1); V.ans=a; render(); }

/* Enter envia — pelo MESMO caminho do botão Responder, sem lógica paralela de
   correção. O guarda de composição é indispensável em japonês: enquanto o IME
   converte kana→kanji, Enter confirma a conversão e não pode submeter.
   `isComposing` é o sinal padrão; keyCode 229 cobre navegadores que não o
   expõem durante a composição. Depois do feedback o campo fica `disabled` e o
   próprio submit() sai em `V.graded`, então não há dupla submissão. */
function ansKey(ev){
  if(ev.key!=='Enter') return;
  if(ev.isComposing||ev.keyCode===229) return;
  ev.preventDefault();
  submit();
}
function submit(){
  const it=cur(); if(!it||V.graded)return;
  const x=it.ex;
  if(x.t==='cloze'){
    const a=V.ans||[];
    const falta=x.bl.filter((b,i)=>a[i]==null).length;
    if(falta){toast(falta===1?'Falta 1 lacuna.':'Faltam '+falta+' lacunas.');return;}
  } else if(V.ans==null||V.ans===''||(Array.isArray(V.ans)&&!V.ans.length)){
    toast('Escreva ou escolha uma resposta.');return;
  }
  const r=gradeAnswer(x,V.ans);
  finish(r.ok?'ok':'bad',r);
}
function dontKnow(){
  if(V.graded)return;
  const it=cur(); if(!it)return;
  const x=it.ex;
  if(x.t==='cloze'){   /* “não sei” cobre todas as lacunas do texto */
    const parts=x.bl.map(b=>({ok:false,chosen:null,expected:b.o[b.a]}));
    finish('idk',{ok:false,chosen:null,parts,score:0,total:parts.length});
    return;
  }
  finish('idk',{ok:false,chosen:null});
}

function finish(res,r){
  const it=cur(),x=it.ex;
  V.graded={res,...r};
  if(it.stage>=0)V.stageVisited[it.stage]=true;
  /* --- cloze: cada lacuna é julgada e contabilizada SEPARADAMENTE ---------
     errar a lacuna 3 não pode marcar como fracas as gramáticas 1, 2 e 4.
     Cada lacuna vira uma entrada de log com o seu próprio ponto e veredicto. */
  if(x.t==='cloze'&&r.parts){
    const falhou=[];
    x.bl.forEach((b,i)=>{
      const p=r.parts[i];
      const br=(res==='idk')?'idk':(p.ok?'ok':'bad');
      applyResult(b.g,br,b.s||x.s,x.id);
      V.sessionLog.push({gid:b.g,gids:[b.g],exId:x.id,res:br,skill:b.s||x.s,
                         t:'cloze',blank:i});
      if(br==='bad'&&p.chosen) noteConfusion(p.expected,p.chosen);
      if(br!=='ok') falhou.push(b.g);
    });
    /* só as gramáticas realmente erradas voltam na etapa de consolidação */
    if(V.run.mode!=='jlpt'){
      falhou.slice(0,2).forEach(gid=>{
        const alt=altExercise(gid,x.id);
        if(alt&&alt.t!=='cloze'&&!V.requeue.some(q=>q.ex.id===alt.id))
          V.requeue.push({stage:4,ex:alt,gid,requeued:true});
      });
    }
    decideNext();
    save(); render(); return;
  }
  const gids=exGids(x);
  /* Instantâneo do registro ANTES de aplicar, só em memória (nunca gravado).
     É o que permite converter este acerto em chute sem criar uma segunda
     tentativa: markGuess() restaura exatamente este estado e reaplica a MESMA
     tentativa como `guess`. Sem ele, desfazer um applyResult('ok') exigiria
     adivinhar iv, dim e se S.ses tinha acabado de entrar em r.ses. */
  if(res==='ok') V.guessSnap=gids.map(gid=>[gid,S.gp[gid]?JSON.parse(JSON.stringify(S.gp[gid])):null]);
  else V.guessSnap=null;
  gids.forEach(gid=>applyResult(gid,res,x.s,x.id));
  /* confusão detectada em múltipla escolha de partícula/estrutura */
  if(res==='bad'&&x.t==='mc'&&r.chosen) noteConfusion(x.o[x.a],r.chosen);
  if(res==='bad'&&x.t==='star'&&r.chosen) noteConfusion(r.expected,r.chosen);
  V.sessionLog.push({gid:gids[0],gids,exId:x.id,res,skill:x.s,t:x.t});
  /* errou ou não sabe → volta mais tarde NA MESMA sessão, com OUTRO exemplo */
  if((res==='bad'||res==='idk')&&V.run.mode!=='jlpt'){
    const alt=altExercise(gids[0],x.id);
    if(alt&&!V.requeue.some(q=>q.ex.id===alt.id)) V.requeue.push({stage:4,ex:alt,gid:gids[0],requeued:true});
  }
  decideNext();
  save(); render();
}
/* “Chutei”: reclassifica a MESMA tentativa. Restaura o estado anterior ao
   applyResult('ok') e reaplica como 'guess' — seen e used voltam a ser
   incrementados uma única vez a partir do estado pré-tentativa, então não há
   contagem dupla. O registro do sessionLog é reescrito, não duplicado, e o
   save() imediato mantém a política de persistir cada resposta na hora. */
function markGuess(){
  if(!V.graded||V.graded.res!=='ok'||V.graded.guessed) return;
  const it=cur(); if(!it) return;
  const x=it.ex;
  if(x.t==='cloze') return;                 /* cloze julga por lacuna — ver relatório */
  (V.guessSnap||[]).forEach(([gid,snap])=>{
    if(snap) S.gp[gid]=JSON.parse(JSON.stringify(snap)); else delete S.gp[gid];
  });
  exGids(x).forEach(gid=>applyResult(gid,'guess',x.s,x.id));
  for(let k=V.sessionLog.length-1;k>=0;k--){
    if(V.sessionLog[k].exId===x.id){ V.sessionLog[k].res='guess'; break; }
  }
  V.graded.res='guess'; V.graded.guessed=true; V.guessSnap=null;
  save(); render();
}

/* Garantia de sessão: um mesmo ex.id nunca ocupa duas posições da fila. Os
   seletores já filtram contra os IDs da fila; isto só assegura o invariante
   de ponta a ponta, qualquer que seja o caminho. Mexe apenas no FUTURO (após
   V.i) — o que já foi apresentado é imutável. Placeholder não tem ex e passa.
   Conta TELAS, não registros: um cloze é um item, com N entradas no log. */
function dedupeRun(){
  if(!V.run) return;
  const seen=new Set(), out=[];
  V.run.items.forEach((it,k)=>{
    if(!it.ex){ out.push(it); return; }
    if(seen.has(it.ex.id)&&k>V.i) return;
    seen.add(it.ex.id); out.push(it);
  });
  if(out.length!==V.run.items.length){ V.run.items=out; recalcRunEstimate(); }
}
/* Decide, NO MOMENTO DA CORREÇÃO, o que o próximo clique fará — para o botão
   nunca prometer “Ver resultado” e entregar outra questão, nem o contrário.
   Tudo o que antes só acontecia dentro de next() acontece aqui, uma vez: o
   corte por tempo (trimTimedSession/trimQuick, com a questão respondida como
   atual, igual a antes), a materialização da etapa 5 quando ela é a próxima e
   o top-up quando a fila acabou. next() apenas executa V.graded.next. */
function decideNext(){
  trimTimedSession(); trimQuick();
  const nx=V.run.items[V.i+1];
  if(nx&&nx.placeholder) fillStage5();
  if(V.i+1>=V.run.items.length){ topUpSession()||quickTopUp(); }
  dedupeRun();
  V.graded.next=V.i+1<V.run.items.length?'continue':'results';
}
function next(){
  /* Um clique = uma transição. Sem tentativa corrigida não há o que avançar:
     um segundo disparo cai aqui e sai, sem pular atividade. */
  if(!V.graded) return;
  const fim=V.graded.next?V.graded.next==='results':V.i+1>=V.run.items.length;
  V.graded=null;V.ans=null;V.i++;V.starView=null;V.starViewFor=null;
  if(fim||V.i>=V.run.items.length){ stopClock(); go('results'); return; }
  const it=cur();
  if(it&&it.placeholder){ fillStage5(); }   /* salvaguarda — decideNext já materializa */
  if(V.i>=V.run.items.length){ stopClock(); go('results'); return; }
  render();
}

/* ===================================================================
   PRÁTICA RÁPIDA (5 / 10 min)
   Modo de REVISÃO curta, deliberadamente separado da Sessão de gramática:
   não tem as cinco etapas, não passa por buildSession/trimTimedSession/
   topUpSession e por isso não pode alterar 15/30/45/60 — todas aquelas
   funções saem por `mode!=='sessao'` antes de fazer qualquer coisa.

   O que ele REAPROVEITA é tudo o que define progresso e elegibilidade:
   practiceGrammar (fonte + unidade + provas marcadas), poolFor (que já aplica
   exSourceOn), pickEx, recentlyUsed, isDue, weakScore, stateOf, costOf,
   applyResult, gradeAnswer, o relógio e a tela de resultados.
   =================================================================== */
const QUICK_MIN=[5,10];
const quickTarget=m=>(m||0)*60;
/* Formatos que cabem num intervalo curto e no polegar. É o MESMO conjunto que
   as etapas de recuperação e contraste declaram (types:['mc']). Resposta
   escrita já sai no portão central; cloze (texto), star e order ficam para a
   sessão completa. */
const QUICK_TYPES=['mc'];
const QUICK_GID_CAP=2;          /* no máximo 2 atividades do mesmo ponto */
const QUICK_TOPUP_ROUNDS=20, QUICK_TOPUP_BATCH=4;

/* "Já estudado" é o marcador que o próprio motor usa: rec() cria seen:0 e
   applyResult faz seen++; isDue() também lê !r.seen como “nunca visto”.
   Nenhum segundo marcador é criado. */
const quickStudied=gid=>{const r=S.gp[gid];return !!(r&&r.seen>0);};
/* "Erro recente" = a ÚLTIMA resposta registrada para o ponto foi erro ou
   “não sei” (applyResult grava last=-1). Determinístico, sem janela de tempo
   artificial, e não é punição permanente: o próximo acerto devolve last a 1
   (ou 0.5 em chute). É a mesma noção que weakScore já usa. */
const quickRecentError=gid=>{const r=S.gp[gid];return !!(r&&r.seen&&r.last<0);};
function quickPriority(gid){
  if(!quickStudied(gid))     return 4;   /* fallback, ver quickCandidates */
  if(isDue(gid))             return 0;   /* A · revisão vencida */
  if(stateOf(gid)==='fraco') return 1;   /* B · fraco */
  if(quickRecentError(gid))  return 2;   /* C · erro recente */
  return 3;                              /* D · já estudado */
}
/* Estudados primeiro, na ordem de prioridade; os nunca estudados ficam na
   CAUDA como fallback explícito. Assim quem tem histórico nunca recebe ponto
   novo, e quem tem 0–2 pontos estudados não fica repetindo os mesmos. */
function quickCandidates(){
  const elig=practiceGrammar();
  const rank=g=>({g,p:quickPriority(g.id),w:weakScore(g.id)});
  const studied=elig.filter(g=>quickStudied(g.id)).map(rank)
                    .sort((a,b)=>a.p-b.p||b.w-a.w);
  const novos=elig.filter(g=>!quickStudied(g.id)).map(rank);
  for(let i=novos.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[novos[i],novos[j]]=[novos[j],novos[i]];}
  return studied.concat(novos);
}
/* fill só entra quando é de resposta curta — `short:true` já existe no banco
   (30 dos 31 fill; x33 pede DUAS partículas e fica de fora), então nenhum
   campo novo precisou ser criado.

   O `every` sobre exGids é a diferença em relação ao poolFor global: para os
   tipos não-cloze, poolFor deixa entrar quem tem PELO MENOS UM ponto liberado
   — comportamento histórico que não se altera. Num contraste isso traria
   junto pontos de lições/tópicos ainda desligados (x198 cobra ので mesmo com
   o Básico só até a lição 4). Numa revisão curta, isso é conteúdo que o
   usuário não viu; aqui exige-se TODOS os pontos cobrados liberados. */
function quickPool(gid,used,eligibleSet){
  return poolFor([gid],{types:QUICK_TYPES,curricular:true})
    .filter(x=>{
      if(used.has(x.id)) return false;
      if(x.t==='fill'&&x.short!==true) return false;
      const g=exGids(x);
      return g.length&&g.every(id=>eligibleSet.has(id));
    });
}
function quickAppend(items,used,perGid,cand,limit,budget,eligibleSet){
  let spent=items.reduce((a,i)=>a+costOf(i.ex),0), added=0;
  for(let relax=0;relax<2;relax++){
    for(let round=0;round<6;round++){
      let n=0;
      for(const c of cand){
        if(added>=limit||(budget&&spent>=budget)) return added;
        if(!relax&&(perGid[c.g.id]||0)>=QUICK_GID_CAP) continue;
        const last=items[items.length-1];
        if(last&&last.gid===c.g.id) continue;      /* nunca dois seguidos */
        const x=pickEx(quickPool(c.g.id,used,eligibleSet),recentlyUsed(c.g.id));
        if(!x) continue;
        used.add(x.id); perGid[c.g.id]=(perGid[c.g.id]||0)+1;
        items.push({stage:-1,ex:x,gid:c.g.id});
        spent+=costOf(x); added++; n++;
      }
      if(!n) break;
    }
    if(added>=limit||(budget&&spent>=budget)) break;
  }
  return added;
}
function buildQuick(min){
  const cand=quickCandidates(); if(!cand.length) return null;
  /* calculado UMA vez por construção e reusado em todo o filtro */
  const eligibleSet=new Set(practiceGrammar().map(g=>g.id));
  const items=[],used=new Set(),perGid={};
  quickAppend(items,used,perGid,cand,99,quickTarget(min)*TOPUP_FILL_TO,eligibleSet);
  if(!items.length) return null;
  const run={mode:'quick',items,planMin:min,estSec:0};
  run.estSec=items.reduce((a,i)=>a+costOf(i.ex),0);
  return run;
}
/* Mesmo princípio do corte da sessão normal, aplicado só ao quick: aos 100%
   do alvo nenhuma atividade NOVA começa; a que está aberta termina. */
function trimQuick(){
  if(!V.run||V.run.mode!=='quick')return;
  clockPulse();
  const target=quickTarget(V.run.planMin);
  if(target&&V.activeMs/1000>=target){
    V.softEnding=true;
    V.run.items=V.run.items.slice(0,V.i+1);
    recalcRunEstimate();
  }
}
/* Top-up isolado: mesma ideia do normal (ritmo real, não COST), mas função
   própria — topUpSession() não é tocado. */
function quickTopUp(){
  if(!V.run||V.run.mode!=='quick')return false;
  const target=quickTarget(V.run.planMin); if(!target)return false;
  clockPulse();
  const now=V.activeMs/1000;
  if(now>=target*TOPUP_BELOW)return false;
  if((V.topUps||0)>=QUICK_TOPUP_ROUNDS)return false;
  const answered=new Set(V.sessionLog.map(r=>r.exId)).size;
  const pace=answered?Math.max(15,now/answered):55;
  const slots=Math.max(1,Math.min(QUICK_TOPUP_BATCH,
                Math.ceil((target*TOPUP_FILL_TO-now)/pace)));
  const used=new Set(V.run.items.filter(i=>i.ex).map(i=>i.ex.id));
  const perGid={}; V.run.items.forEach(i=>{ if(i.gid) perGid[i.gid]=(perGid[i.gid]||0)+1; });
  const add=quickAppend(V.run.items,used,perGid,quickCandidates(),slots,0,
                       new Set(practiceGrammar().map(g=>g.id)));
  if(!add)return false;
  V.topUps=(V.topUps||0)+1; recalcRunEstimate();
  return true;
}
function startQuick(min){
  if(QUICK_MIN.indexOf(min)<0)return;
  if(!practiceGrammar().length){toast('Libere ao menos uma lição em Ajustes.');return;}
  beginSession();                     /* revisão real: conta como sessão */
  const r=buildQuick(min);
  if(!r){toast('Nenhuma atividade curta disponível com os filtros atuais.');return;}
  startRun(r,'Prática rápida · '+min+' min',min);
}

/* etapa 5 é montada em tempo real com o que falhou hoje */
function fillStage5(){
  const idx=V.run.items.findIndex(i=>i.placeholder);
  if(idx<0) return;
  const ph=V.run.items[idx];
  const stg=ph.stage;                   /* índice REAL da etapa, não a posição na fila */
  clockPulse();
  const target=(V.run.planMin||V.planMin||0)*60;
  /* Um placeholder NÃO é questão preparada: é uma reserva para gerar trabalho
     depois. A regra pós-alvo da Sessão normal é “termine o que já é questão,
     não crie nada novo” — então, alcançado o alvo, o marcador simplesmente sai
     e nada nasce no lugar. A guarda é explícita de propósito: confiar em
     budget=0 não bastaria, porque `canAdd` deixa passar o PRIMEIRO item fora
     do orçamento (`items.length===0`) e o passo 5 adiciona uma consolidação
     sem consultar budget. Atividades materializadas ANTES do alvo já viraram
     itens concretos da fila e continuam sendo terminadas normalmente. */
  if(V.run.mode==='sessao'&&target&&V.activeMs/1000>=target){
    V.run.items.splice(idx,1);
    recalcRunEstimate();
    return;
  }
  const remaining=target?Math.max(0,target-V.activeMs/1000):(ph.budget||600);
  const budget=Math.min(ph.budget||600,remaining);
  const items=[];let spent=0;
  const used=new Set(V.run.items.filter(i=>i.ex).map(i=>i.ex.id));
  const canAdd=x=>!used.has(x.id)&&(items.length===0||spent+costOf(x)<=budget);
  const add=(x,gid)=>{ used.add(x.id); items.push({stage:stg,ex:x,gid:gid}); spent+=costOf(x); };
  const semCloze=x=>x.t!=='cloze';      /* cloze só entra pela porta controlada abaixo */
  /* A etapa 5 existe primeiro para “o que escapou hoje”. A ordem abaixo é
     deliberada: erros da sessão → fraquezas → cloze (se sobrar orçamento)
     → revisões vencidas. Um texto de 270–325 s nunca passa à frente da
     repescagem, e nunca é forçado quando não cabe. */
  /* 1) outro exercício do ponto errado nesta sessão */
  V.requeue.slice().sort((a,b)=>costOf(a.ex)-costOf(b.ex))
    .forEach(q=>{ if(canAdd(q.ex)) add(q.ex,q.gid); });
  /* 2) pontos fracos históricos */
  weakList(20).forEach(g=>{
    if(items.length&&spent>=budget)return;
    const pool=poolFor([g.id],{curricular:true}).filter(x=>!used.has(x.id)&&semCloze(x));
    const x=pickEx(pool,recentlyUsed(g.id)); if(!x)return;
    if(canAdd(x))add(x,g.id);
  });
  /* 3) NO MÁXIMO UM texto 文章の文法, e só se ainda couber INTEIRO no que
        restou do orçamento depois dos erros e das fraquezas. */
  if(V.run.mode==='sessao'){
    const el=new Set(practiceGrammar().map(g=>g.id));
    const czs=ALLEX.filter(x=>x.t==='cloze'&&isPracticable(x)&&!used.has(x.id)&&exSourceOn(x)
                 &&exGids(x).length&&exGids(x).every(id=>el.has(id))
                 &&spent+costOf(x)<=budget);
    const cz=pickEx(czs,new Set());
    if(cz) add(cz,exGids(cz)[0]);
  }
  /* 4) revisões vencidas ainda não cobertas */
  practiceGrammar().filter(g=>isDue(g.id)).forEach(g=>{
    if(items.length&&spent>=budget)return;
    const pool=poolFor([g.id],{curricular:true}).filter(x=>!used.has(x.id)&&semCloze(x));
    const x=pickEx(pool,recentlyUsed(g.id)); if(!x)return;
    if(canAdd(x))add(x,g.id);
  });
  /* 5) se não houve erro, fraqueza, cloze que coubesse nem revisão vencida,
        ainda toca a etapa de consolidação com uma única revisão comum. */
  if(!items.length){
    const gs=practiceGrammar();
    for(const g of gs){
      const pool=poolFor([g.id],{curricular:true}).filter(x=>!used.has(x.id)&&semCloze(x));
      const min=Math.min(...pool.map(costOf));
      const x=pickEx(pool.filter(e=>costOf(e)===min),recentlyUsed(g.id));
      if(x){add(x,g.id);break;}
    }
  }
  V.run.items.splice(idx,1,...items);   /* sem itens, o marcador simplesmente sai */
  recalcRunEstimate();
}

/* ---- correção pedagógica ---- */
function feedbackPoint(x,gs){
  if(Object.prototype.hasOwnProperty.call(x,'fbPoint')){
    return x.fbPoint===false?'':String(x.fbPoint||'').trim();
  }
  const w=String(x.w||'').trim(),exp=x.t==='star'?starSentence(x):expectedText(x);
  const onlyAnswer=w&&norm(w.replace(/<[^>]*>/g,''))===norm(exp);
  if(w&&!onlyAnswer)return w;
  const g=gs[0];
  return g?(g.tip||g.f||(g.s||'').split('\n')[0]):w;
}
function feedbackRuleHtml(x,gs,brief){
  if(Object.prototype.hasOwnProperty.call(x,'fbRule')){
    if(x.fbRule===false)return '';
    if(typeof x.fbRule==='string'&&Object.prototype.hasOwnProperty.call(FEEDBACK_RULES,x.fbRule)){
      return esc(FEEDBACK_RULES[x.fbRule]).replace(/\n/g,'<br>');
    }
    console.warn('[Bunpou Lab] fbRule desconhecida "'+String(x.fbRule)+'" em '+(x.id||'atividade sem id')+'; usando fallback do grammar point.');
  }
  return gs.map(q=>brief?esc(q.t):`${esc(q.t)} — <span class="jp">${esc((q.s||'').split('\n')[0])}</span>`).join('<br>');
}
function feedbackContrast(x){
  if(x.ct===false)return null;
  if(typeof x.ct==='string')return CMAP[x.ct]||null;
  return exIsContrast(x)?CMAP[x.g]:null;
}
/* Em `mc` a chave de `wr` é a alternativa exata. Em resposta escrita não há
   alternativa: a chave precisa ser comparada pelo mesmo normalizador que
   julga o acerto, senão um 。 ou um espaço a mais derrubaria a explicação
   dirigida e o aluno voltaria a receber o texto genérico. */
function answerWhy(x,chosen){
  if(!chosen||!x.wr)return '';
  if(x.wr[chosen])return x.wr[chosen];
  const u=toKana(norm(chosen));
  if(!u)return '';
  for(const k in x.wr){ if(toKana(norm(k))===u) return x.wr[k]; }
  return '';
}
function genericWrongWhy(x){
  if(x.t==='correct')return 'A forma enviada ainda não corrige o ponto indicado; compare a mudança com a regra abaixo.';
  if(x.t==='trans')return 'A resposta não preserva exatamente a transformação pedida; compare forma, tempo e polaridade.';
  if(x.t==='prod'||x.t==='fill')return 'A forma enviada não completa o sentido e a estrutura exigidos neste contexto.';
  if(x.t==='order')return orderWrongWhy(x);
  if(x.t==='star')return 'O fragmento escolhido não ocupa a posição marcada quando a frase é montada por inteiro.';
  return 'Esta escolha não completa a estrutura pedida neste contexto.';
}
/* Efeito de “Não sei” no SRS, dito com precisão: applyResult('idk') conta
   idk, zera o intervalo e marca revisão para a próxima sessão; fora do Mini
   JLPT, finish() ainda enfileira outro exemplo do ponto nesta mesma sessão. */
function idkNote(){
  return 'Registrado como “não sei” — não conta como acerto. O ponto volta para revisão na próxima sessão'+
    (V.run&&V.run.mode!=='jlpt'?' e outro exemplo aparece mais adiante nesta.':'.');
}
/* Rodapé interno de TODO quadro de feedback: o controle do ChatGPT pertence
   à explicação. `data-nochat` marca o que é da interface ou do registro
   (este rodapé, a nota de “não sei”, o aviso de chute) e fica fora do texto
   levado ao ChatGPT — o que é pedagógico vai inteiro. */
const CHAT_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M9.5 10a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.5"/><path d="M12 16.5h.01"/></svg>';
function feedbackHtml(x,g){
  const html=feedbackBody(x,g);
  const foot=`<div class="fb-foot" data-nochat><button type="button" class="chat-btn" onclick="askChatGPT()"
      title="Perguntar ao ChatGPT" aria-label="Perguntar ao ChatGPT">${CHAT_ICON}<span>ChatGPT</span></button></div>`;
  return html.replace(/<\/div>\s*$/,foot+'</div>');
}
function feedbackBody(x,g){
  const res=V.graded.res,ok=res==='ok'||res==='guess';
  const cls=(res==='idk'||res==='guess')?'idk':(ok?'good':'bad');
  const head=res==='ok'?'✓ Correto':
             res==='guess'?'✓ Correto<span data-nochat> — você marcou como chute</span>':
             res==='idk'?'Vamos ver juntos':'✗ Ainda não';
  /* Cloze continua julgando cada lacuna de modo independente. Se tudo foi
     certo, evita-se a parede de texto; erro/“não sei” abre o detalhe. */
  if(x.t==='cloze'&&V.graded.parts){
    const P=V.graded.parts,acertos=P.filter(p=>p.ok).length;
    if(acertos===P.length&&res==='ok')return `<div class="fb good">
      <div class="verdict">✓ ${acertos} de ${P.length} lacunas corretas</div>
      ${x.w?`<div class="fline"><span class="fl-t">Ponto-chave</span>${esc(x.w)}</div>`:''}</div>`;
    const cls2=acertos===P.length?'good':(acertos===0?'bad':'idk');
    return `<div class="fb ${cls2}">
      <div class="verdict">${acertos} de ${P.length} lacunas corretas</div>
      ${P.map((p,i)=>{
        const b=x.bl[i],gb=GMAP[b.g],brule=feedbackRuleHtml(b,gb?[gb]:[],true);
        return `<div class="czfb ${p.ok?'good':'bad'}">
          <div class="czfb-h"><span class="czn">${i+1}</span>
            ${!p.ok&&p.chosen?`<span class="muted">você marcou <span class="jp bad">${esc(p.chosen)}</span> · </span>`:''}
            ${!p.ok&&!p.chosen?'<span class="muted">em branco · </span>':''}
            <span class="jp good">${esc(p.expected)}</span></div>
          <div class="czfb-w">${esc(b.w||'')}</div>
          ${b.ctx?`<div class="czfb-ctx"><b>No texto:</b> ${esc(b.ctx)}</div>`:''}
          ${brule?`<div class="muted" style="margin-top:4px">Regra: ${brule}</div>`:''}
        </div>`;}).join('')}
      ${x.w?`<div class="fline"><span class="fl-t">Sobre o texto</span>${esc(x.w)}</div>`:''}
      ${res==='idk'?`<div class="fline muted" data-nochat>${idkNote()}</div>`:''}
    </div>`;
  }
  const gs=primaryGrammars(x,g&&g.id),point=feedbackPoint(x,gs),ct=feedbackContrast(x);
  const exp=x.t==='star'?x.tk[x.ord[x.star]]:expectedText(x);
  const chosen=V.graded.chosen;
  let reason='';
  if(res==='bad'&&x.t==='mc'&&chosen&&x.wr&&x.wr[chosen])reason=x.wr[chosen];
  else if(res==='bad'&&x.t==='mc'&&chosen&&PART_WHY[chosen])reason=PART_WHY[chosen];
  else if(res==='bad')reason=(x.t==='mc'?'':answerWhy(x,chosen))||genericWrongWhy(x);
  const rules=feedbackRuleHtml(x,gs,false);
  const starOrder=x.t==='star'&&(res==='bad'||res==='idk')?`
    <div class="fline"><span class="fl-t">Ordem correta</span><span class="jp">${x.ord.map((i,pos)=>
      `<span class="stfrag${pos===x.star?' on':''}">${esc(x.tk[i])}</span>`).join('<span class="starrow">→</span>')}</span></div>
    <div class="fline"><span class="fl-t">Frase montada</span><span class="jp good" style="font-size:16px">${esc(starSentence(x))}</span></div>`:'';
  if(res==='ok'){
    /* `okfb` (opcional) separa o acerto em blocos curtos: tradução (só a que
       já existe escrita na atividade), ponto-chave e forma. Sem `okfb`, o
       acerto continua com o ponto-chave único de sempre. Erro, “Não sei” e
       chute não usam este campo. */
    const ok=x.okfb;
    if(ok&&(ok.tr||ok.pt||ok.fm)){
      const bloco=(t,v)=>v?`<div class="fline"><span class="fl-t">${t}</span><span class="fl-tr">${esc(v).replace(/\n/g,'<br>')}</span></div>`:'';
      return `<div class="fb good"><div class="verdict">${head}</div>
        ${bloco('Tradução',ok.tr)}${bloco('Ponto-chave',ok.pt)}${bloco('Forma',ok.fm)}</div>`;
    }
    return `<div class="fb good"><div class="verdict">${head}</div>
    ${point?`<div class="fline"><span class="fl-t">Ponto-chave</span>${esc(point)}</div>`:''}</div>`;
  }
  return `<div class="fb ${cls}">
    <div class="verdict">${head}</div>
    ${res==='bad'&&chosen?`<div class="fline"><span class="fl-t">Você marcou</span><span class="jp bad">${esc(chosen)}</span></div>`:''}
    ${res==='bad'||res==='idk'?`<div class="fline"><span class="fl-t">${x.t==='star'?'Fragmento correto em ★':'Resposta correta'}</span><span class="jp good" style="font-size:16px">${esc(exp)}</span></div>`:''}
    ${res==='bad'?`<div class="fline"><span class="fl-t">${x.t==='mc'?'Por que sua escolha não é a resposta':'Por que esta resposta não atende ao pedido'}</span>${esc(reason)}</div>`:''}
    ${point?`<div class="fline"><span class="fl-t">Ponto-chave</span>${esc(point)}</div>`:''}
    ${rules?`<div class="fline"><span class="fl-t">Regra utilizada</span>${rules}</div>`:''}
    ${starOrder}
    ${x.ne?`<div class="fline"><span class="fl-t">Outro exemplo da mesma regra</span>
      <span class="jp" style="font-size:16px">${esc(x.ne[0])}</span><br><span class="muted">${esc(x.ne[1])}</span></div>`:''}
    ${ct?`<div class="fline"><span class="fl-t">Contraste útil aqui</span><span class="jp">${esc(ct.t)}</span> — ${esc(ct.note)}</div>`:''}
    ${res==='idk'?`<div class="fline muted" data-nochat>${idkNote()}</div>`:''}
  </div>`;
}

/* ---------- RESULTADO ---------- */
/* Rosca dos resultados. NÃO recalcula nada: recebe as mesmas contagens que
   alimentam a tabela “Como você respondeu”. O total do centro é o número de
   RESPOSTAS avaliadas (um cloze contribui uma por lacuna), não de atividades —
   por isso o rótulo é “respostas”. Com total 0 desenha só o trilho, sem
   divisão por zero. */
/* Percentual de cada categoria sobre o MESMO total que a rosca representa.
   Duas casas, vírgula decimal (pt-BR, o locale já usado nas datas do app).
   Total 0 → 0,00% em todas, sem divisão por zero. Cada fatia é calculada e
   arredondada isoladamente: a soma exibida pode dar 99,99% ou 100,01%, e
   isso é preferível a distorcer uma categoria para forçar 100,00%. */
const pctBR=(n,total)=>(total?n*100/total:0)
  .toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%';
function donutHtml(parts){
  const total=parts.reduce((a,p)=>a+p.n,0);
  const R=52, C=2*Math.PI*R;
  let off=0;
  const segs=parts.filter(p=>p.n>0).map(p=>{
    const len=total?C*p.n/total:0;
    const el=`<circle class="seg" cx="66" cy="66" r="${R}" stroke="${p.c}"
      stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}"
      stroke-dashoffset="${(-off).toFixed(2)}"></circle>`;
    off+=len; return el;
  }).join('');
  const desc=parts.map(p=>`${p.t}: ${p.n} (${pctBR(p.n,total)})`).join(', ');
  return `<div class="dnut">
    <svg viewBox="0 0 132 132" role="img" aria-label="Distribuição das ${total} respostas — ${esc(desc)}">
      <g transform="rotate(-90 66 66)">
        <circle class="track" cx="66" cy="66" r="${R}"></circle>${segs}
      </g>
      <text class="cnum" x="66" y="64" text-anchor="middle" dominant-baseline="middle">${total}</text>
      <text class="clab" x="66" y="82" text-anchor="middle">respostas</text>
    </svg>
    <div class="dleg">${parts.map(p=>
      `<div class="${p.n?'':'zero'}"><i style="background:${p.c}"></i>${esc(p.t)}<b>${p.n}</b><span class="pct">${pctBR(p.n,total)}</span></div>`).join('')}</div>
  </div>`;
}
function renderResults(){
  const L=V.sessionLog;
  /* um cloze grava uma entrada POR LACUNA: as contagens de acerto/erro são
     por decisão, mas “atividades” conta a tela, não a lacuna. */
  const atividades=new Set(L.map(r=>r.exId)).size;
  const semAjuda=L.filter(r=>r.res==='ok').length;   /* `guess` fica de fora */
  /* Acerto “com dica” não é mais produzido (o botão saiu). O contador fica
     para registros antigos em memória e para o campo `hint` do histórico. */
  const comAjuda=L.filter(r=>r.res==='hint').length;
  const chutes=L.filter(r=>r.res==='guess').length;
  const erros=L.filter(r=>r.res==='bad').length;
  const naoSei=L.filter(r=>r.res==='idk').length;
  const prod=L.filter(r=>r.skill==='pro'&&r.res==='ok').length;
  const prodT=L.filter(r=>r.skill==='pro').length;
  /* pontos fortes e a revisar */
  const per={};
  L.forEach(r=>{const p=per[r.gid]=per[r.gid]||{ok:0,bad:0};
    /* chute não conta como acerto nem como erro: não é ponto forte nem falha */
    if(r.res==='ok')p.ok++;else if(r.res!=='hint'&&r.res!=='guess')p.bad++;});
  const fortes=Object.entries(per).filter(([,p])=>p.ok>=1&&!p.bad).map(([g])=>g).slice(0,6);
  const rever=Object.entries(per).filter(([,p])=>p.bad>0).map(([g])=>g).slice(0,8);
  const confs=Object.entries(S.conf).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const nm=g=>GMAP[g]?GMAP[g].t:g;
  if(L.length&&!V.logged){   /* grava o histórico uma única vez por sessão */
    V.logged=true;
    /* `n` sempre significou ATIVIDADES na coluna “Atividades” do histórico.
       Com o cloze gravando uma entrada por lacuna, L.length passou a contar
       DECISÕES — usar L.length aqui inflaria a coluna e quebraria a
       comparação com as sessões anteriores à Fase 2. `dec` guarda as
       decisões à parte (registros antigos simplesmente não têm o campo). */
    /* `real` permanece em segundos para compatibilidade. Em registros novos
       representa o TEMPO DECORRIDO da sessão: aba/app em background contam,
       só as pausas voluntárias do próprio app (Ajustes, modal, popover) são
       descontadas. Registros antigos guardavam tempo ativo e continuam
       válidos como estão — nada é migrado, o schema não muda. */
    /* `mode` só aparece na Prática rápida; registros antigos e sessões
       normais seguem sem o campo, e toda a leitura do histórico continua
       funcionando sem ele. */
    /* `guess` entra como campo próprio e só quando houve algum: registros
       antigos e sessões sem chute continuam exatamente com o mesmo formato. */
    S.hist.push(Object.assign({d:Date.now(),ses:S.ses,plan:V.planMin||null,real:V.clock,
                 n:atividades,dec:L.length,ok:semAjuda,hint:comAjuda,bad:erros+naoSei},
                 chutes?{guess:chutes}:{}, quickRun()?{mode:'quick'}:{}));
    if(S.hist.length>60) S.hist=S.hist.slice(-60);
    save();
  }
  return `<div class="wrap"><div style="padding:34px 0 0">
    <h1 class="h-page mincho">${quickRun()?`Prática rápida · ${V.planMin} min`
      :`Sessão concluída${V.planMin?` · plano de ${V.planMin} min`:''}`}</h1>
    <p class="lead">${atividades} atividade${atividades===1?'':'s'}${
      L.length!==atividades?` · ${L.length} decisões avaliadas`:''} em ${fmt(V.clock)} de sessão.</p>
    <div class="grid g2" style="margin-top:20px">
      <div class="card pad">
        <div class="lab" style="font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint)">Como você respondeu</div>
        ${donutHtml([{t:'Acertos sem ajuda',n:semAjuda,c:'var(--midori)'}].concat(
                     comAjuda?[{t:'Com dica',n:comAjuda,c:'var(--gold)'}]:[],[
                     {t:'Chutes assumidos',n:chutes,  c:'var(--ai-2)'},
                     {t:'Erros',           n:erros,   c:'var(--shu)'},
                     {t:'“Não sei”',       n:naoSei,  c:'var(--ink-faint)'}]))}
        <table class="tbl" style="margin-top:14px"><tbody>
          <tr><td>Acertos sem ajuda</td><td><b>${semAjuda}</b></td></tr>
          ${comAjuda?`<tr><td>Com dica</td><td><b>${comAjuda}</b></td></tr>`:''}
          ${chutes?`<tr><td>Chutes assumidos</td><td><b>${chutes}</b></td></tr>`:''}
          <tr><td>Erros</td><td><b>${erros}</b></td></tr>
          <tr><td>“Não sei”</td><td><b>${naoSei}</b></td></tr>
          ${prodT?`<tr><td>Ordenações ★ corretas</td><td><b>${prod}</b> de ${prodT}</td></tr>`:''}
        </tbody></table>
      </div>
      <div class="card pad">
        <div class="lab" style="font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint)">Confusões detectadas</div>
        ${confs.length?`<ul class="exlist">${confs.map(([k,v])=>
          `<li><span class="jp">${esc(k)}</span> <span class="muted">· ${v}×</span></li>`).join('')}</ul>`
          :'<p class="muted" style="margin-top:8px">Nenhuma confusão recorrente registrada.</p>'}
      </div>
    </div>
    ${fortes.length?`<div class="h-sec">Pontos mais firmes hoje</div>
      <div class="row">${fortes.map(g=>`<span class="chip">${esc(nm(g))}</span>`).join('')}</div>`:''}
    ${rever.length?`<div class="h-sec">Voltam na próxima revisão</div>
      <div class="row">${rever.map(g=>`<span class="chip src-basico">${esc(nm(g))}</span>`).join('')}</div>`:''}
    <div class="row" style="margin-top:26px">
      <button class="btn btn-primary" onclick="goHome()">Início</button>
      ${rever.length?`<button class="btn" onclick="startWeak()">Treinar o que falhou</button>`:''}
      <button class="btn btn-ghost" onclick="go('progress')">Ver progresso</button>
    </div>
    <div class="foot">Os intervalos de revisão foram atualizados. Cada ponto precisa sobreviver a mais de uma sessão para consolidar.</div>
  </div></div>`;
}

function renderProgress(){
  const parts=SRC_ORDER.map(sid=>{

    /* O domínio continua sendo por GID (o SRS não muda). Esta seção é a visão
       desses mesmos pontos pela lente das provas marcadas: inclui os pontos
       próprios de Provas e os compartilhados que as provas cobrem — que também
       aparecem na fonte curricular, como já acontece entre Rikai/NNK/TRY. */
    if(S0.examSource){
      const pv=provasStats();
      const cob=[...provasGidSet()].map(id=>GMAP[id]).filter(Boolean);
      const byState={};STATES.forEach(k=>byState[k]=0);
      cob.forEach(g=>byState[stateOf(g.id)]++);

          ${cob.length} ${cob.length===1?'ponto gramatical coberto':'pontos gramaticais cobertos'}</div>
        ${cob.length?`<div class="row">${STATES.map(k=>byState[k]?

  /* Rikai aparece como um cabeçalho com as duas partes; cada uma mantém as

    return parts[i];
  }).join('');

  const weak=weakList(12);

  const hist=S.hist.slice(-8).reverse();

  return `<div class="wrap"><div style="padding:30px 0 0">

          <span class="state st-${stateOf(g.id)}">${STATE_LABEL[stateOf(g.id)]}</span>

    <div class="h-sec">Confusões recorrentes</div>
    ${confs.length?`<div class="card pad"><div class="row">${confs.map(([k,v])=>

    <div class="h-sec">Revisões vencidas</div>

     <div class="card pad scrollx"><table class="tbl"><thead><tr>
       <th>Data</th><th>Plano</th><th>Tempo</th><th>Atividades</th>
       <th>Sem ajuda</th>${histHint?'<th>Com dica</th>':''}<th>A rever</th></tr></thead><tbody>
       ${hist.map(h=>`<tr><td>${new Date(h.d).toLocaleDateString('pt-BR')}</td>
         <td>${h.plan?h.plan+' min':'—'}</td><td>${h.real?fmt(h.real):'—'}</td>
         <td>${h.n}</td><td>${h.ok}</td>${histHint?`<td>${h.hint||0}</td>`:''}<td>${h.bad}</td></tr>`).join('')}
     </tbody></table></div>`:''}

    <div class="row" style="margin-top:26px">
      <button class="btn btn-primary" onclick="goBack()">← Voltar</button>
      <button class="btn btn-ghost" onclick="go('config')">Ajustes</button></div>
    <div class="foot"></div>
  </div></div>`;
}

/* Popover da tag de origem. Funciona por CLIQUE (não hover), para servir no
   celular. Fecha ao clicar de novo, ao clicar fora e com Escape. Não navega,
   não mexe na sessão e não toca em Enter/1–4/IME: os handlers globais só
   reagem quando há popover aberto e usam a fase de captura apenas para o
   clique-fora. */
function closeOrigin(){
  document.querySelectorAll('.ori-pop:not([hidden])').forEach(p=>{
    p.hidden=true;
    const b=p.parentNode&&p.parentNode.querySelector('.ori');
    if(b) b.setAttribute('aria-expanded','false');
  });
}
function toggleOrigin(ev,btn){
  ev.preventDefault(); ev.stopPropagation();
  const pop=btn.parentNode.querySelector('.ori-pop'), aberto=!pop.hidden;
  closeOrigin();
  if(!aberto){ pop.hidden=false; btn.setAttribute('aria-expanded','true'); }
}
document.addEventListener('click',e=>{ if(!e.target.closest||!e.target.closest('.ori-wrap')) closeOrigin(); });
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  if(!document.querySelector('.ori-pop:not([hidden])')) return;   /* nada aberto: não interfere */
  e.preventDefault();   /* este Esc já foi usado: não chega a encerrar a sessão */
  closeOrigin();
});
/* Esc na tela de atividade = o MESMO confirmQuit() do botão “Encerrar
   sessão”: abre a mesma confirmação, com o mesmo texto e os mesmos botões, e
   não encerra nada sozinho. Com essa confirmação aberta, Esc faz o que o
   botão Continuar (cancelar) faz: closeModal(). Os Esc já usados por outro
   handler (popover de conta, popover de origem) chegam com defaultPrevented e
   são ignorados. Fora da tela de atividade, nada muda. */
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape'||e.defaultPrevented||e.repeat) return;
  if(e.isComposing||e.keyCode===229) return;
  if(V.view!=='run'||!V.run) return;
  const ov=document.getElementById('overlay');
  if(ov&&ov.classList.contains('show')){ e.preventDefault(); closeModal(); return; }
  if(document.querySelector('.overlay.show')) return;
  const t=e.target;
  if(t&&t.id!=='inp'&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable)) return;
  if(!cur()) return;
  e.preventDefault();
  confirmQuit();
});
/* ---------- Perguntar ao ChatGPT ----------
   chatgpt.com/?prompt=… abre uma conversa nova com o texto JÁ no campo de
   mensagem e não envia (testado em navegador real). NÃO usar ?q=, que envia
   sozinho. Abre em NOVA aba: a sessão daqui não muda. Só se a URL passar de
   CHAT_PREFILL_MAX é que o fluxo antigo (copiar e colar) entra.

   O texto leva só o que está na tela: enunciado, vocabulário visível,
   alternativas (com as mesmas marcas visuais de correta/escolha/chute) e o
   feedback LIDO DO DOM já renderizado (.qcard .fb). Nada de id, gid, SRS,
   histórico, origem interna ou campos que não foram desenhados. */
const CHAT_URL='https://chatgpt.com/';
const CHAT_PREFILL_MAX=8000;   /* caracteres da URL já codificada */
/* HTML que o próprio app gerou → texto com as quebras de bloco preservadas. */
function visibleText(html){
  return String(html||'')
    .replace(/<(div|span)\b[^>]*\bdata-nochat\b[^>]*>[\s\S]*?<\/\1>/g,'')
    .replace(/<span class="starrow">[^<]*<\/span>/g,' → ')
    .replace(/<span class="stfrag on">([^<]*)<\/span>/g,'$1 (★)')
    .replace(/<span class="fl-t">([^<]*)<\/span>/g,'\n$1:\n')
    .replace(/<span class="czn">([^<]*)<\/span>/g,'$1. ')
    .replace(/<br\s*\/?>/gi,'\n')
    .replace(/<\/?(div|p)\b[^>]*>/gi,'\n')
    .replace(/<[^>]+>/g,'')
    .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&')
    .split('\n').map(l=>l.replace(/[ \t]+/g,' ').trim()).join('\n')
    .replace(/\n{3,}/g,'\n\n').trim();
}
function chatOptLine(label,txt,i,correct){
  const g=V.graded, mine=V.ans===i&&g.res!=='idk', marks=[];
  if(i===correct) marks.push(g.res==='idk'?'resposta correta':'correta');
  if(mine&&g.res!=='idk') marks.push(i===correct?'minha resposta':'minha escolha');
  return label+'. '+txt+(marks.length?'  ← '+marks.join(' · '):'');
}
function chatPayload(){
  const it=cur(); if(!it||!it.ex||!V.graded) return '';
  const x=it.ex, L=[];
  L.push('Estou estudando japonês para o JLPT N5 e fiquei com dúvida nesta questão do Bunpou Lab.','','QUESTÃO','');
  L.push(visibleText(x.p));
  if(x.gl) L.push('','Vocabulário: '+Object.entries(x.gl).map(([k,v])=>k+' = '+v).join(' · '));
  if(x.t==='mc'){
    L.push('','Alternativas:');
    x.o.forEach((o,i)=>L.push(chatOptLine('ABCD'[i],o,i,x.a)));
  } else if(x.t==='star'){
    L.push('',(x.pre+x.ord.map((_,p)=>p===x.star?'★':'＿＿').join(' ')+x.post).replace(/<br\s*\/?>/gi,'\n'));
    L.push('','Alternativas (fragmento da posição ★):');
    starView(x).forEach((i,p)=>L.push(chatOptLine(String(p+1),x.tk[i],i,x.ord[x.star])));
  } else if(x.t==='cloze'){
    L.push('',String(x.tx).replace(/｛(\d+)｝/g,'［$1］'));
    x.bl.forEach((b,i)=>{ L.push('','Lacuna ［'+(i+1)+'］:'); b.o.forEach((o,j)=>L.push('ABCD'[j]+'. '+o)); });
  }
  const fbEl=document.querySelector('.qcard .fb');
  const fb=visibleText(fbEl?fbEl.innerHTML:'');
  L.push('','EXPLICAÇÃO MOSTRADA PELO BUNPOU LAB','',fb||'(sem explicação na tela)');
  L.push('','Minha dúvida:','');
  return L.join('\n');
}
function copyTextSync(t){
  try{
    const ta=document.createElement('textarea');
    ta.value=t; ta.setAttribute('readonly','');
    ta.style.position='fixed'; ta.style.top='0'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    const ok=document.execCommand('copy');
    document.body.removeChild(ta);
    return !!ok;
  }catch(e){ return false; }
}
async function askChatGPT(){
  const txt=chatPayload(); if(!txt) return;
  const url=CHAT_URL+'?prompt='+encodeURIComponent(txt);
  if(url.length<=CHAT_PREFILL_MAX){ window.open(url,'_blank','noopener'); return; }
  let ok=copyTextSync(txt);
  if(!ok&&navigator.clipboard&&navigator.clipboard.writeText){
    try{ await navigator.clipboard.writeText(txt); ok=true; }catch(e){}
  }
  if(!ok){ V.chatFallback={i:V.i,txt}; render(); return; }
  V.chatFallback=null;
  toast('Questão copiada. No ChatGPT, cole (Ctrl+V ou ⌘V) e escreva sua dúvida.');
  window.open(CHAT_URL,'_blank','noopener');
}
function toggleProva(n){

}

function setLim(sid,v){S.cfg.lim[sid]=Math.max(0,Math.min(unitCount(sid),parseInt(v)||0));save();render();}
function toggleManual(sid){

  else S.cfg.manual[sid]=UNITS[sid].filter(u=>u.n<=S.cfg.lim[sid]).map(u=>u.n);

/* ---------- backup manual ---------- */
function exportProgress(){
  const blob=new Blob([JSON.stringify({format:'bunpou-lab-backup',version:1,
