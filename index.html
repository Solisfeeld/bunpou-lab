<style>
/* ===================================================================
   文法ラボ — paleta washi preservada do projeto original
   =================================================================== */
:root{
  --paper:#F4EFE4; --card:#FBF7EE; --card-2:#F7F1E4;
  --ink:#1C1B18; --ink-soft:#514D45; --ink-faint:#8A8478;
  --ai:#20395B; --ai-2:#2F5488; --ai-wash:#E7EAF1;
  --shu:#C33C2A; --shu-wash:#F6E3DD;
  --midori:#33795B; --midori-wash:#E1EDE5;
  --line:#DDD5C3; --line-strong:#C7BDA6;
  --gold:#A8843F; --gold-wash:#F3EBD9;
  --murasaki:#6A4A7C; --murasaki-wash:#EDE5F2;   /* 5ª fonte: Provas antigas */
  --on-accent:#fff;
  --glass:rgba(244,239,228,.93);
  --g1:rgba(32,57,91,.05); --g2:rgba(195,60,42,.04);
  --shadow:0 1px 0 rgba(28,27,24,.04), 0 10px 30px -18px rgba(28,27,24,.45);
  --shadow-lg:0 2px 0 rgba(28,27,24,.03), 0 22px 50px -26px rgba(28,27,24,.5);
}
html[data-theme="dark"]{
  --paper:#15181E; --card:#1E232B; --card-2:#232932;
  --ink:#ECE6DA; --ink-soft:#B3ADA1; --ink-faint:#807B71;
  --ai:#6E93CE; --ai-2:#89A9DE; --ai-wash:rgba(110,147,206,.16);
  --shu:#E5715B; --shu-wash:rgba(229,113,91,.16);
  --midori:#5BAF88; --midori-wash:rgba(91,175,136,.15);
  --line:#2C3038; --line-strong:#434A55;
  --gold:#C6A968; --gold-wash:rgba(198,169,104,.14);
  --murasaki:#B18FC9; --murasaki-wash:rgba(177,143,201,.16);
  --on-accent:#12161F;
  --glass:rgba(21,24,30,.90);
  --g1:rgba(110,147,206,.10); --g2:rgba(229,113,91,.07);
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 12px 34px -18px rgba(0,0,0,.75);
  --shadow-lg:0 2px 0 rgba(0,0,0,.35), 0 24px 56px -28px rgba(0,0,0,.9);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  background:var(--paper); color:var(--ink); line-height:1.62;
  -webkit-font-smoothing:antialiased;
  background-image:
     radial-gradient(circle at 12% -5%, var(--g1), transparent 42%),
     radial-gradient(circle at 100% 0%, var(--g2), transparent 36%);
  min-height:100vh;
}
.mincho{font-family:"Shippori Mincho",Georgia,serif;}
button,input,textarea,select{font-family:inherit;font-size:inherit;}
button{cursor:pointer;}
a{color:var(--ai-2);}

/* ---------- shell ---------- */
.wrap{max-width:940px;margin:0 auto;padding:0 18px 90px;}
.topbar{
  position:sticky;top:0;z-index:40;backdrop-filter:blur(10px);
  background:var(--glass);border-bottom:1px solid var(--line);
}
.topbar-in{max-width:940px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:12px;}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.01em;background:none;border:0;color:var(--ink);padding:0;}
.brand .seal{
  width:31px;height:31px;border-radius:50%;background:var(--shu);color:#FBF7EE;
  display:grid;place-items:center;font-size:15px;font-weight:800;flex:none;
}
.brand small{display:block;font-size:10.5px;color:var(--ink-faint);font-weight:500;letter-spacing:.06em;text-transform:uppercase;}
.sp{flex:1}
.iconbtn{
  border:1px solid var(--line-strong);background:var(--card);color:var(--ink-soft);
  border-radius:9px;padding:6px 11px;font-size:12.5px;font-weight:600;
}
.iconbtn:hover{border-color:var(--ai);color:var(--ai);}
/* Ajustes fica marcado como tela atual, mas nunca some nem vira outro botão */
.iconbtn.on{background:var(--ai-wash);border-color:var(--ai);color:var(--ai);}

/* ---------- typography ---------- */
h1,h2,h3,h4{line-height:1.28;margin:0;}
.h-page{font-size:29px;font-weight:800;letter-spacing:-.015em;}
.h-sec{font-size:12px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-faint);margin:34px 0 13px;}
.lead{color:var(--ink-soft);font-size:15px;max-width:64ch;}
.jp{font-size:1.06em;}
.jpq{font-weight:700;font-size:1.1em;letter-spacing:.01em;}
.muted{color:var(--ink-faint);font-size:13px;}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);}
.pad{padding:19px 21px;}
.grid{display:grid;gap:14px;}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g4{grid-template-columns:repeat(4,1fr);}
.gsrc{grid-template-columns:repeat(4,1fr);}
@media (max-width:860px){.gsrc{grid-template-columns:repeat(2,1fr);}}
@media (max-width:400px){.gsrc{grid-template-columns:1fr;}}
@media (max-width:1040px){.g4{grid-template-columns:repeat(2,1fr);}}

/* source cards */
.srccard{
  display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden;
  transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease;
  /* o card é um <button>: sem cor explícita, o h3 herdava ButtonText (preto)
     do user-agent e sumia no tema escuro. Mesma declaração que .act já tinha. */
  color:var(--ink);
}
.srccard:hover{transform:translateY(-2px);border-color:var(--accent,var(--ai));box-shadow:var(--shadow-lg);}
.srccard .rail{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent,var(--ai));}
.srccard .kanji{
  font-family:"Shippori Mincho",serif;font-size:34px;font-weight:700;color:var(--accent,var(--ai));
  opacity:.9;line-height:1;margin-bottom:9px;
}
.srccard h3{font-size:18px;font-weight:800;margin-bottom:3px;}
.srccard .sub{font-size:12.5px;color:var(--ink-faint);margin-bottom:12px;}
.srccard .meter{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:7px;}
.srccard .meter i{display:block;height:100%;background:var(--accent,var(--ai));border-radius:3px;}
.srccard .stats{font-size:12px;color:var(--ink-soft);display:flex;gap:12px;flex-wrap:wrap;}

/* action row */
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(184px,1fr));gap:11px;}
.act{
  background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px 16px;text-align:left;
  box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease;color:var(--ink);
}
.act:hover{transform:translateY(-2px);border-color:var(--ai);}
.act.hero{background:var(--ai);border-color:var(--ai);color:#fff;}
.act.hero .t{color:#fff;} .act.hero .d{color:rgba(255,255,255,.82);}
.act .t{font-weight:800;font-size:15px;display:block;margin-bottom:2px;}
.act .d{font-size:12.5px;color:var(--ink-faint);display:block;line-height:1.45;}
/* cartão da sessão: escolha de duração + botão de início */
.act.hero{grid-column:1/-1;cursor:default;}
.act.hero:hover{transform:none;}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.34);border-radius:11px;overflow:hidden;margin:13px 0 11px;}
.seg button{background:transparent;border:0;border-right:1px solid rgba(255,255,255,.24);
  color:rgba(255,255,255,.86);padding:7px 15px;font-size:13px;font-weight:800;line-height:1.25;text-align:center;}
.seg button:last-child{border-right:0;}
.seg button:hover{background:rgba(255,255,255,.12);}
.seg button.on{background:#fff;color:var(--ai);}
.seg small{display:block;font-size:9.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;opacity:.72;}
/* seletor de duração da Prática rápida: fundo claro e alvo de toque grande */
.qpick{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0 4px;}
.qpick button{flex:1 1 150px;min-height:60px;border:1px solid var(--line-strong);border-radius:13px;
  background:var(--card);color:var(--ink);font-size:18px;font-weight:800;line-height:1.2;
  box-shadow:var(--shadow);padding:12px 16px;}
.qpick button:hover{border-color:var(--gold);}
.qpick button small{display:block;font-size:11px;font-weight:600;color:var(--ink-faint);
  margin-top:3px;text-transform:none;letter-spacing:0;}
.startbtn{display:block;width:100%;background:#fff;color:var(--ai);border:0;border-radius:11px;
  padding:11px 18px;font-size:14.5px;font-weight:800;}
.startbtn:hover{filter:brightness(.95);}
/* ---------- conta e sincronização (controle global na topbar) ---------- */
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;}
.sdot.ok{background:var(--midori);} .sdot.warn{background:var(--gold);} .sdot.bad{background:var(--shu);}
.acct-wrap{position:relative;flex:none;}
.acct-btn{
  display:inline-flex;align-items:center;gap:7px;max-width:215px;
  border:1px solid var(--line-strong);background:var(--card);color:var(--ink-soft);
  border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:700;
  transition:border-color .15s,color .15s,background .15s;
}
.acct-btn:hover{border-color:var(--ai);color:var(--ai);}
.acct-btn .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.acct-btn .lbl.short{display:none;}
.acct-btn.warn{border-color:var(--gold);color:var(--gold);background:var(--gold-wash);}
.acct-btn.attn{border-color:var(--shu);color:var(--shu);background:var(--shu-wash);}
.acct-pop{
  position:absolute;top:calc(100% + 10px);right:0;z-index:60;width:290px;text-align:left;
  background:var(--card);border:1px solid var(--line-strong);border-radius:14px;
  box-shadow:var(--shadow-lg);padding:16px;
}
.acct-pop .st{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;}
.acct-pop .who{font-size:12.5px;color:var(--ink-faint);word-break:break-all;margin-top:5px;}
.acct-pop .meta{font-size:11.5px;color:var(--ink-faint);margin-top:9px;}
.acct-pop .btn{display:block;width:100%;text-align:center;margin-top:8px;}
.acct-pop .sep{height:1px;background:var(--line);margin:13px 0 4px;}
@media (max-width:640px){
  .brand small{display:none;}
  .acct-btn{max-width:none;padding:6px 11px;}
  .acct-btn .lbl.full{display:none;} .acct-btn .lbl.short{display:inline;}
  .acct-pop{position:fixed;top:56px;left:12px;right:12px;width:auto;}
}

/* ---------- buttons ---------- */
.btn{
  border:1px solid var(--line-strong);background:var(--card);color:var(--ink);
  border-radius:10px;padding:10px 17px;font-weight:700;font-size:14px;
  transition:background .15s,border-color .15s,color .15s;
}
.btn:hover{border-color:var(--ai);color:var(--ai);}
.btn-primary{background:var(--ai);border-color:var(--ai);color:#fff;}
.btn-primary:hover{background:var(--ai-2);border-color:var(--ai-2);color:#fff;}
.btn-shu{background:var(--shu);border-color:var(--shu);color:#fff;}
.btn-shu:hover{filter:brightness(1.08);color:#fff;}
.btn-ghost{background:transparent;}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:8px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}

/* ---------- chips / badges ---------- */
.chip{
  display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-strong);
  background:var(--card-2);border-radius:999px;padding:3px 11px;font-size:12px;color:var(--ink-soft);font-weight:600;
}
.chip.src-intro{background:var(--ai-wash);border-color:transparent;color:var(--ai);}
.chip.src-basico{background:var(--shu-wash);border-color:transparent;color:var(--shu);}
.chip.src-nnk{background:var(--midori-wash);border-color:transparent;color:var(--midori);}
.chip.src-try{background:var(--gold-wash);border-color:transparent;color:var(--gold);}
.chip.src-provas{background:var(--murasaki-wash);border-color:transparent;color:var(--murasaki);}
.chip.src-lab{background:var(--card-2);border-color:var(--line-strong);color:var(--ink-soft);}
.chip.ori{cursor:pointer;font:inherit;font-size:12px;font-weight:600;}
.chip.ori:focus-visible{outline:2px solid var(--ai);outline-offset:2px;}
.ori-wrap{position:relative;display:inline-block;}
.ori-k{display:block;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-faint);font-weight:700;margin-top:9px;}
.ori-k:first-child{margin-top:0;}
.ori-pop{position:absolute;z-index:40;top:calc(100% + 6px);left:0;min-width:210px;max-width:min(320px,80vw);
  background:var(--card);border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;
  box-shadow:var(--shadow-lg);font-size:12.5px;line-height:1.5;color:var(--ink);text-align:left;white-space:normal;}
@media (max-width:520px){.ori-pop{left:auto;right:0;}}
.chip.skill{background:var(--gold-wash);border-color:transparent;color:var(--gold);}

.state{display:inline-block;border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:700;}
.st-novo{background:var(--card-2);color:var(--ink-faint);border:1px solid var(--line);}
.st-aprendendo{background:var(--ai-wash);color:var(--ai);}
.st-fraco{background:var(--shu-wash);color:var(--shu);}
.st-consolidando{background:var(--gold-wash);color:var(--gold);}
.st-forte{background:var(--midori-wash);color:var(--midori);}
.st-consolidado{background:var(--midori);color:#fff;}

/* ---------- study (explicação) ---------- */
.gp{border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:13px;overflow:hidden;box-shadow:var(--shadow);}
.gp-head{padding:15px 18px;display:flex;align-items:flex-start;gap:12px;cursor:pointer;background:none;border:0;width:100%;text-align:left;color:var(--ink);}
.gp-head:hover{background:var(--card-2);}
.gp-head .tt{flex:1;}
.gp-head .tt b{font-size:16px;font-weight:800;display:block;}
.gp-head .tt .jpbit{font-size:13px;color:var(--ink-faint);}
.gp-body{padding:0 18px 18px;border-top:1px solid var(--line);}
.field{margin-top:15px;}
.field .lab{
  font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-faint);margin-bottom:5px;
}
.struct{
  font-family:"Shippori Mincho",serif;background:var(--card-2);border:1px dashed var(--line-strong);
  border-radius:9px;padding:10px 13px;font-size:15px;font-weight:600;
}
.exlist{list-style:none;margin:0;padding:0;}
.exlist li{padding:8px 0;border-bottom:1px dashed var(--line);}
.exlist li:last-child{border-bottom:0;}
.exlist .j{font-size:16px;font-weight:600;}
.exlist .p{font-size:13px;color:var(--ink-soft);}
.callout{border-radius:10px;padding:11px 14px;font-size:13.5px;margin-top:14px;}
.callout .cl-t{font-weight:800;font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;}
.cl-err{background:var(--shu-wash);color:var(--ink);} .cl-err .cl-t{color:var(--shu);}
.cl-tip{background:var(--midori-wash);color:var(--ink);} .cl-tip .cl-t{color:var(--midori);}
.cl-con{background:var(--ai-wash);color:var(--ink);} .cl-con .cl-t{color:var(--ai);}
/* .bad dá apenas COR. O risco fica em .strike, aplicado só ao trecho que
   representa uma forma incorreta — nunca a um contêiner: text-decoration
   propaga para todos os descendentes e não pode ser removida por eles,
   então .bad num card riscava o feedback inteiro. */
.bad{color:var(--shu);}
.strike{text-decoration:line-through;}
.good{color:var(--midori);font-weight:700;}

/* ---------- exercise ---------- */
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);padding:22px 24px;}
.qtop{display:flex;align-items:center;gap:9px;margin-bottom:14px;flex-wrap:wrap;}
.qprompt{font-size:17px;line-height:1.65;margin-bottom:6px;}
.qprompt .blank{
  display:inline-block;min-width:56px;border-bottom:2.5px solid var(--shu);
  text-align:center;font-weight:800;color:var(--shu);
}
.gloss{font-size:12.5px;color:var(--ink-faint);margin-top:8px;}
.gloss code{background:var(--card-2);border-radius:4px;padding:1px 5px;font-family:inherit;font-weight:700;color:var(--ink-soft);}
.opts{display:grid;gap:9px;margin-top:16px;}
.opt{
  display:flex;align-items:center;gap:11px;border:1.5px solid var(--line);background:var(--card-2);
  border-radius:11px;padding:12px 15px;text-align:left;font-size:15px;color:var(--ink);width:100%;
  transition:border-color .13s,background .13s;
}
.opt:hover{border-color:var(--ai);}
.opt .k{
  width:23px;height:23px;border-radius:6px;border:1.5px solid var(--line-strong);
  display:grid;place-items:center;font-size:11.5px;font-weight:800;color:var(--ink-faint);flex:none;
}
.opt.sel{border-color:var(--ai);background:var(--ai-wash);}
.opt.sel .k{border-color:var(--ai);background:var(--ai);color:#fff;}
.opt.ok{border-color:var(--midori);background:var(--midori-wash);}
.opt.ok .k{border-color:var(--midori);background:var(--midori);color:#fff;}
.opt.no{border-color:var(--shu);background:var(--shu-wash);}
.opt.no .k{border-color:var(--shu);background:var(--shu);color:#fff;}
.opt:disabled{cursor:default;}

.tin{
  width:100%;border:1.5px solid var(--line-strong);background:var(--card-2);color:var(--ink);
  border-radius:11px;padding:13px 15px;font-size:17px;margin-top:15px;
}
.tin:focus{outline:none;border-color:var(--ai);}
.tin.ok{border-color:var(--midori);} .tin.no{border-color:var(--shu);}
/* legenda do campo de resposta: diz O QUE digitar, logo acima do input */
.innote{margin-top:15px;font-size:12.5px;color:var(--ink-faint);}
.innote + .tin{margin-top:7px;}
/* aviso de prática sem conta: discreto, sem bloquear nem pausar */
.authnote{margin:0 0 14px;padding:8px 12px;border:1px dashed var(--line-strong);border-radius:10px;
  font-size:12.5px;line-height:1.45;color:var(--ink-soft);background:var(--card-2);}

.tokens{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px;}
.tok{border:1.5px solid var(--line-strong);background:var(--card-2);border-radius:9px;padding:8px 14px;font-size:15.5px;font-weight:600;color:var(--ink);}
.tok:hover{border-color:var(--ai);}
.tok.placed{background:var(--ai-wash);border-color:var(--ai);color:var(--ai);}
.slot{
  min-height:50px;border:1.5px dashed var(--line-strong);border-radius:11px;margin-top:15px;
  padding:9px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card-2);
}
.slot:empty::after{content:"toque nas peças abaixo para montar a frase";color:var(--ink-faint);font-size:12.5px;padding:0 6px;}


/* ---- 文章の文法 (cloze) e ★並べかえ -------------------------------- */
.opt.right{border-color:var(--midori);background:var(--midori-wash);}
.opt.right .k{border-color:var(--midori);background:var(--midori);color:#fff;}
.opt.wrong{border-color:var(--shu);background:var(--shu-wash);}

.opt.wrong .omark{color:var(--shu);}

/* ===================================================================
   GRAMMAR — pontos gramaticais
   Um id  = um conceito. `src` lista TODAS as fontes onde ele aparece,

   duplicado, mas continua sendo filtrável por fonte.

/* Proveniência da ATIVIDADE, distinta da fonte do ponto gramatical. Um ponto
   pode ser ensinado por Rikai E pelo TRY!; uma atividade, não: ela nasceu de
   um material específico. `EX_SRC` marca em bloco o trecho que veio de uma
   fonte, e `sx` fica no exercício. Sem marca, a atividade é de acervo geral e
   segue valendo pela elegibilidade do ponto, como sempre foi. */
let EX_SRC=null;
/* `og` = PROVENIÊNCIA da atividade: de qual material ela foi escrita. É
   separada de `sx` (que decide elegibilidade) e de `g.src` (que diz em quais
   fontes o PONTO aparece). Marcada em bloco, como EX_SRC, porque o banco já
   está organizado por material de origem. */
let EX_ORIGIN=null;
const X=(g,t,s,o)=>{o.g=g;o.t=t;o.s=s;o.id='x'+EX.length;if(EX_SRC)o.sx=EX_SRC;if(EX_ORIGIN)o.og=EX_ORIGIN;EX.push(o);return o;};
/* ---- 文章の文法: texto com lacunas -------------------------------------
   `tx` é o texto; ｛1｝…｛n｝ marcam as lacunas na ordem de `bl`.
   Cada lacuna tem o SEU ponto gramatical (`g`), as suas opções e a sua
   explicação — é isso que permite pontuar e culpar item a item.
   `gs` (união dos pontos) é derivado aqui para o motor não recalcular.

   INVARIANTE DE CONTEÚDO: um mesmo cloze não deve repetir o mesmo `g` em
   duas lacunas. Cada lacuna gera um applyResult próprio, então repetir o
   ponto comprimiria o intervalo de revisão dele duas vezes na mesma tela.
   Verificado pelo checker; hoje há 0 casos.                              */
const CZ=o=>{
  o.gs=o.bl.map(b=>b.g).filter((v,i,a)=>a.indexOf(v)===i);
  o.bl.forEach(b=>{ if(!b.s) b.s='dif'; });
  return X(o.bl[0].g,'cloze','mix',o);
};

 wr:{'を':'を marca o objeto de uma ação (ほんを よみます). あります／ありません exprimem existência e não têm objeto: テストを ありません não funciona.','へ':'へ marca a direção de um movimento (がっこうへ いきます). Aqui não há movimento nenhum.','に':'に pode marcar o LUGAR onde algo existe (きょうしつに せんせいが います), mas テスト não é um lugar: テストに ありません não funciona nesta frase.'}});

   O mapa só completa `wr`; IDs, respostas e correção permanecem inalterados. */
const WR_CLARITY={
 x18:{'に … を':'O primeiro に marca corretamente o lugar, mas を trataria エアコン como objeto de uma ação. Com あります, a coisa que existe leva が.','で … が':'O segundo が está correto, mas で marcaria o cenário de uma ação. Como あります indica existência, o lugar leva に.'},
 x20:{'です':'です identifica ou descreve algo; não diz que uma criança existe no parque.','します':'します significa “fazer”. A frase precisa do verbo de existência usado para pessoas e animais.'},
 x21:{'です':'です não expressa que a bolsa está sobre a mesa; para a existência de um objeto, use あります.','なります':'なります significa “tornar-se”. A frase apenas localiza uma bolsa, sem mudança de estado.'},
 x22:{'あります':'あります é o verbo de existência para coisas; いぬ é um animal e pede います.','ありました':'Além de estar no passado, ありました é usado para coisas, não para um animal.','です':'です identifica ou descreve; não expressa a presença do cachorro no jardim.'},
 x25:{'が … で':'A pergunta já tornou o correio conhecido, portanto ele fica com は; além disso, あります localiza com に, não で.','は … で':'は retoma corretamente o correio, mas で marcaria uma ação. Para dizer onde ele fica com あります, use に.'},
 x29:{'×（nenhuma）':'Sem に, o horário exato ７じ fica sem a marca de momento da ação.'},
 x37:{'で … に':'で marca corretamente a estação, mas おります pede を para o veículo do qual se desce.','を … に':'を não marca o lugar onde se desce, e に combina com のります, não com おります.'},
 x39:{'ので':'Com ので, a ligação N5 seria やすいので, sem o です que já aparece antes da lacuna. Aqui ですから encaixa diretamente.'},
 x42:{'に … で':'O destino やま leva に, mas a finalidade み precisa de outro に antes de いきます.','で … を':'で faria de やま o lugar de uma ação, não o destino, e を não liga a finalidade ao deslocamento.'},
 x45:{'たべます':'たべます apenas declara “comemos/comeremos”; não convida o colega nem abre espaço para ele aceitar ou recusar.'},
 x46:{'いきましょうか':'いきましょうか volta a consultar ou oferecer algo. Como a saída já foi aceita, basta いきましょう para confirmar “vamos”.','いきます':'いきます declara que alguém vai; não dá o sinal conjunto de “vamos”.'},
 x47:{'もちましょう':'もちましょう significa “vamos carregar”, como ação conjunta; não pergunta se a pessoa quer que você ajude.','もちます':'もちます apenas afirma “carrego/vou carregar”; falta a pergunta que transforma isso em oferta.'},
 x49:{'いきほしいです':'ほしい não se cola a um verbo para dizer que se quer fazer algo. Para querer ir, retire ます de いきます e acrescente たい.'},
 x50:{'を したいです':'コンピューターを したい seria “quero fazer computador”, não “quero ter um computador”.','が したいです':'したい precisa nomear uma ação que se quer fazer; コンピューター sozinho é a coisa desejada, por isso combina com ほしい.'},
 x53:{'さむくでした':'さむく é forma de ligação e não pode fechar o passado com でした. O próprio i-adjetivo muda para さむかった.','さむいだったです':'だった é passado de substantivo ou NA-adjetivo; さむい é i-adjetivo e faz さむかったです.'},
 x54:{'たいへんくないです':'くない forma a negativa de i-adjetivo; たいへん é NA-adjetivo, e a frase pede passado afirmativo.','たいへんいでした':'たいへん não recebe い. Como NA-adjetivo no passado, liga-se diretamente a でした.'},
 x58:{'いきます':'いきます é afirmativo e não combina com どこにも no sentido de “lugar nenhum”; além disso, きのう pede passado.','いっています':'いっています significa “está indo/dizendo” conforme o verbo e continua afirmativo; não expressa “não fui a lugar nenhum”.'},
 x59:{'が … あげました':'あげました faria do tópico o doador, mas a frase diz que わたし recebeu do irmão; além disso, o irmão não leva が nesse padrão.','を … もらいました':'もらいました está certo para quem recebe, mas o doador あに leva に ou から, não を.'},
 x60:{'しました':'しました significa “fez”. Não expressa que o irmão deu chocolate para mim.'},
 x62:{'まつを':'Para pedir a ação “esperar”, まちます precisa virar まって antes de ください; Vる＋を não forma pedido de ação.'},
 x64:{'それ':'それ fica sozinho no lugar de uma coisa e não pode vir diretamente antes de ほん.','あれ':'あれ também substitui a coisa e, além disso, aponta algo longe; diante de ほん é necessário この／その／あの.'},

 x68:{'きれくないです':'きれい não é i-adjetivo, portanto não se retira い para formar くない.','きれいないです':'ない não se liga diretamente a きれい; como NA-adjetivo, a negativa é きれいじゃないです.'},
 x71:{'すきです':'えいがは すきです fala de gostar de filmes em geral; não avalia como foi o filme que acabou de ser visto.','すきじゃないです':'Além de falar de preferência geral, すきじゃないです diz que a pessoa não gosta; a reação pedida é que o filme foi interessante/bom.'},

 x76:{'すみました':'すみました apresenta “morar” como fato passado; a pergunta pede a residência que continua agora.','すんでです':'A forma て não se liga a です aqui; a situação contínua é すんでいます.'},
 x77:{'ふりました':'ふりました diz que nevou no passado; いま pede a ação ocorrendo neste instante.','ふって':'ふって apenas conecta a outra forma; falta います para fechar “está nevando”.'},
 x78:{'あけます':'あけます é transitivo: alguém abre alguma coisa. Com ドアが, o verbo é あく, e o estado atual pede あいています.','あきました':'あきました relata que a porta abriu; não declara diretamente que ela continua aberta agora.'},
 x79:{'さきます':'さきます diz que as flores florescem ou florescerão; não destaca o estado visível agora.','さきました':'さきました relata o acontecimento passado “floresceram”; o enunciado pede o estado que permanece.','さいて':'さいて é apenas a forma de ligação; falta います para formar o estado さいています.'},
 x81:{'かきました':'かきました relata que alguém escreveu; não descreve o texto que permanece escrito na carta.','かきます':'かきます significa “escreve/escreverá”; não apresenta o resultado deixado por alguém.'},
 x82:{'こども':'Como こども é substantivo, falta の para ligá-lo a とき.','こどもだ':'だ fecha uma afirmação simples; diante de とき, o substantivo se liga com の.'},
 x83:{'ひま':'Usando ひま como NA-adjetivo nesta frase, falta な antes de とき.','ひまに':'に liga o NA-adjetivo a certos verbos, mas não a とき; diante de とき, use な.','ひまだ':'だ não liga NA-adjetivo a とき; a forma de ligação é な.'},
 x84:{'だ':'わかい é i-adjetivo e já se liga diretamente a とき; だ é usado para fechar substantivos ou NA-adjetivos na forma simples.'},
 x86:{'きいて':'きいて é a forma て e pede continuação verbal; não transforma “ouvir” no conteúdo do hobby.','きき':'きき é apenas a raiz de ます; para nomear a ação como hobby, use きくこと.'},

   MOTOR — armazenamento, correção, domínio, repetição espaçada
   =================================================================== */
const GMAP={}; GRAMMAR.forEach(g=>GMAP[g.id]=g);
const CMAP={}; CONTRAST.forEach(c=>CMAP[c.id]=c);

/* um exercício pode estar preso a um ponto, a um grupo de contraste, OU
   (cloze) a uma lista própria de pontos — um por lacuna, em `gs`. */
function exGids(ex){
  if(ex.gs) return ex.gs.filter(id=>GMAP[id]);
  return CMAP[ex.g] ? CMAP[ex.g].m.filter(id=>GMAP[id]) : (GMAP[ex.g]?[ex.g]:[]);
}
function exIsContrast(ex){ return !!CMAP[ex.g]; }
/* `pg` documenta a estrutura realmente testada em atividades contrastivas.
   `exGids` continua amplo para atribuir o resultado a todos os pontos do
   contraste; o feedback, porém, não escolhe mais o primeiro gid por acaso. */
function primaryGids(ex,fallback){
  const p=Array.isArray(ex.pg)?ex.pg:(ex.pg?[ex.pg]:[]);
  const explicit=p.filter(id=>GMAP[id]);
  if(explicit.length) return explicit;
  if(GMAP[ex.g]) return [ex.g];
  if(fallback&&GMAP[fallback]) return [fallback];
  return exGids(ex).slice(0,1);
}
function primaryGrammars(ex,fallback){ return primaryGids(ex,fallback).map(id=>GMAP[id]).filter(Boolean); }

/* ---------- exercícios gerados de conjugação ----------
   Gerar garante que a MESMA regra seja cobrada com verbos diferentes
   a cada sessão, sem decorar a frase.                                */
const GEN=[];
const GEN_SUFFIX={te:'て',ru:'る',ta:'た',nai:'ない'};
function generatedWhy(v,form){
  if(v.irr&&(form==='te'||form==='ta')) return v.m+' é uma exceção do Grupo 1 nesta flexão: use '+v[form]+'.';
  if(v.g===3) return v.m+' é irregular do Grupo 3; a forma correspondente é '+v[form]+'.';
  if(v.g===2) return 'No Grupo 2, retire ます e acrescente '+GEN_SUFFIX[form]+': '+v.m+' → '+v[form]+'.';
  const last=v.ru.slice(-1);
  const rule={
    te:{う:'う→って',つ:'つ→って',る:'る→って',む:'む→んで',ぶ:'ぶ→んで',ぬ:'ぬ→んで',く:'く→いて',ぐ:'ぐ→いで',す:'す→して'},
    ta:{う:'う→った',つ:'つ→った',る:'る→った',む:'む→んだ',ぶ:'ぶ→んだ',ぬ:'ぬ→んだ',く:'く→いた',ぐ:'ぐ→いだ',す:'す→した'},
    ru:{う:'い→う',つ:'ち→つ',る:'り→る',む:'み→む',ぶ:'び→ぶ',ぬ:'に→ぬ',く:'き→く',ぐ:'ぎ→ぐ',す:'し→す'},
    nai:{う:'い→わない',つ:'ち→たない',る:'り→らない',む:'み→まない',ぶ:'び→ばない',ぬ:'に→なない',く:'き→かない',ぐ:'ぎ→がない',す:'し→さない'}
  }[form][last];
  return 'No Grupo 1, aplique a mudança '+rule+': '+v.m+' → '+v[form]+'.';
}
function groupHints(v){
  const first='Passe mentalmente para a forma do dicionário e verifique primeiro se é します／きます. O som antes de ます é só uma pista, não a regra inteira.';
  if(v.g===3) return [first,v.m+' → '+v.ru+': する e くる (também em compostos) formam o grupo irregular.'];
  if(v.g===2) return [first,v.m+' → '+v.ru+': neste verbo a base se mantém ao trocar ます por る／て／た／ない, padrão do Grupo 2.'];
  return [first,v.m+' → '+v.ru+': este verbo flexiona mudando a sílaba final entre as linhas do kana, padrão do Grupo 1.'];
}
(function buildGen(){
  ['te','ru','ta','nai'].forEach(form=>{
    VERBS.forEach(v=>{
      GEN.push({id:'gen-'+form+'-'+v.m, g:FORM_GP[form], t:'trans', s:'man', gen:true,
        p:'Passe para a <b>'+FORM_LABEL[form]+'</b>:<br><span class="jpq">'+v.m+'</span> <span class="muted">('+v.pt+' · Grupo '+v.g+')</span>',
        acc:[v[form]], h:FORM_HINT[form],
        w:generatedWhy(v,form),
        ne:null});
    });
  });
  /* identificação de grupo */
  VERBS.forEach(v=>{
    GEN.push({id:'gen-grp-'+v.m, g:'v-groups', t:'mc', s:'rec', gen:true,
      p:'A que grupo pertence <span class="jpq">'+v.m+'</span>? <span class="muted">('+v.pt+')</span>',
      o:['Grupo 1','Grupo 2','Grupo 3'], a:v.g-1,
      h:groupHints(v),
      w:groupHints(v)[1], ne:null});
  });
})();
const ALLEX=EX.concat(GEN);

 '好':'す','元気':'げんき','有名':'ゆうめい','便利':'べんり','天気':'てんき','春':'はる','夏':'なつ',
 '秋':'あき','冬':'ふゆ','医者':'いしゃ','花':'はな','手紙':'てがみ','窓':'まど','外国':'がいこく',
 '健康':'けんこう','誕生日':'たんじょうび','週':'しゅう','月':'つき','年':'ねん','回':'かい','時':'とき','前':'まえ','後':'あと'
};
const _K2K=Object.keys(KANJI2KANA).sort((a,b)=>b.length-a.length);
function toKana(s){ for(const k of _K2K){ if(s.includes(k)) s=s.split(k).join(KANJI2KANA[k]); } return s; }
function norm(s){
  return String(s==null?'':s)
    .replace(/[！-～]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)) /* zenkaku → hankaku */
    .replace(/[　\s]+/g,'')                       /* todos os espaços */
    .replace(/[。、．，.,！!？?・…‥]/g,'')              /* pontuação JP e PT, incl. reticências */
    .replace(/[（）()「」『』【】]/g,'')
    .replace(/[ー―—–\-]/g,'ー')                        /* traço longo unificado */
    .toLowerCase().trim();
}
function acceptMatch(user,accept){
  if(!accept||!accept.length) return false;
  const u=norm(user); if(!u) return false;
  const uk=toKana(u);
  return accept.some(a=>{ const n=norm(a); return n===u || toKana(n)===uk; });
}

/* ---------- armazenamento ----------
   KEY continua sendo o perfil anônimo (e a origem do estado legado).
   Contas autenticadas usam uma chave própria por user.id, para que duas
   pessoas no mesmo navegador nunca compartilhem progresso.              */
const KEY='bunpou-lab-v2';
const SESSION_GAP=20*60*1000;   /* 20 min separam duas sessões de estudo */
let PROFILE=null;               /* null = anônimo; caso contrário, o user.id do Identity */
const storeKey=uid=>{const u=uid===undefined?PROFILE:uid; return u?KEY+':user:'+u:KEY;};
/* Política de fontes vigente. Um estado gravado com `cfg.mig` menor passa
   UMA vez pela migração em hydrateProgress; depois disso as escolhas do
   usuário mandam e nada é religado. */
const CFG_MIG=3;
const DEF=()=>({v:2,
  /* Provas nasce ativa com todas as provas importadas marcadas. Como a chave é
     NOVA, um progresso antigo simplesmente não a tem: o merge com DEF() abaixo
     a acrescenta sem tocar em nada que o usuário já escolheu, então não há
     necessidade de subir CFG_MIG (o que faria rodar migração em quem não
     precisa). Provas usa sempre `manual` — a seleção é por prova, não por
     alcance crescente. */
  cfg:{src:{intro:true,basico:true,nnk:true,'try':true,provas:true},
       lim:{intro:18,basico:18,nnk:16,'try':45,provas:4},
       manual:{intro:null,basico:null,nnk:null,'try':null,provas:[1,2,3,4]},   /* null = usar limite; array = seleção manual */
       mig:CFG_MIG,
       romaji:true,
       sessionMin:60},                             /* progresso antigo sem esta chave herda 60 */
  ses:0, lastSesAt:0, gp:{}, conf:{}, hist:[], lastSession:null});
let S=DEF();

/* Fonte única de compatibilidade: usada pelo localStorage, pela resposta do
   banco e pela importação de backup. Padrões só preenchem o que não existe —
   nunca sobrescrevem preferência já gravada (inclusive cfg.src.nnk). */
function hydrateProgress(p){
  const d=DEF();
  if(!p||typeof p!=='object'||Array.isArray(p)) return d;
  const out=Object.assign(d,p);
  const pc=(p.cfg&&typeof p.cfg==='object'&&!Array.isArray(p.cfg))?p.cfg:{};
  /* A versão de origem sai do OBJETO PERSISTIDO, antes de qualquer merge:
     DEF().cfg já carrega mig:CFG_MIG, então ler out.cfg.mig depois do
     Object.assign daria 2 para um snapshot que nunca teve a chave — e as
     migrações seriam puladas justamente em quem mais precisa delas.
     Chave ausente vira undefined → 0, que é o que queremos. */
  const migFrom=Number(pc.mig)||0;
  out.cfg=Object.assign(DEF().cfg,pc);
  out.cfg.src=Object.assign(DEF().cfg.src,pc.src||{});
  out.cfg.lim=Object.assign(DEF().cfg.lim,pc.lim||{});
  out.cfg.manual=Object.assign(DEF().cfg.manual,pc.manual||{});
  /* Migração ÚNICA para a política de quatro fontes. Estados anteriores podem
     ter nnk:false e lim.basico:17 apenas porque esse era o DEFAULT antigo —
     não porque alguém escolheu. Aqui isso é corrigido uma vez só; a partir do
     marcador gravado, desligar qualquer fonte é decisão do usuário e é
     respeitada em toda carga seguinte. `try` ausente já nasce true pelo merge
     com DEF acima; a migração garante o mesmo para quem tinha nnk desligado. */
  /* Cada etapa decide pela versão de origem, nunca por out.cfg.mig — que já
     foi atualizado pelos merges. Testar contra ele faria a etapa 0→1 rodar de
     novo num estado que já está em 1, religando NNK/TRY/lição 18 que o
     usuário tivesse desligado. */
  if(migFrom<1){
    out.cfg.src.nnk=true; out.cfg.src['try']=true;
    if((out.cfg.lim.basico||0)<18) out.cfg.lim.basico=18;
    if(Array.isArray(out.cfg.manual.basico)&&!out.cfg.manual.basico.includes(18))
      out.cfg.manual.basico=out.cfg.manual.basico.concat(18);
  }
  /* 1 → 2: o eixo do TRY! deixou de ter 8 tópicos posicionais e passou aos 45
     itens numerados do livro. Qualquer limite gravado no eixo antigo perdeu o
     sentido, então é reposto — e só ele. Nenhum interruptor de fonte é
     tocado aqui: escolhas do usuário continuam valendo. */
  if(migFrom<2){
    out.cfg.lim['try']=45;
    if(Array.isArray(out.cfg.manual['try'])) out.cfg.manual['try']=null;
  }
  /* 2 → 3: entraram os conjuntos 3 (prova 2025/07) e 4 (prova 2025/12). Quem
     já tinha uma seleção ganha só esses dois NOVOS marcados, uma vez; o que o
     usuário marcou ou desmarcou antes não muda. */
  if(migFrom<3&&Array.isArray(out.cfg.manual.provas)){
    [3,4].forEach(n=>{ if(!out.cfg.manual.provas.includes(n)) out.cfg.manual.provas=out.cfg.manual.provas.concat(n); });
  } else if(migFrom<3&&(out.cfg.lim.provas|0)>=2){ out.cfg.lim.provas=4; }
  out.cfg.mig=CFG_MIG;
  if(!SESSION_PRESETS[out.cfg.sessionMin]) out.cfg.sessionMin=60;
  out.gp  =(p.gp  &&typeof p.gp  ==='object'&&!Array.isArray(p.gp))  ?p.gp  :{};
  out.conf=(p.conf&&typeof p.conf==='object'&&!Array.isArray(p.conf))?p.conf:{};
  out.hist=Array.isArray(p.hist)?p.hist:[];
  out.ses =Number.isFinite(p.ses)?p.ses:0;
  out.lastSesAt=Number.isFinite(p.lastSesAt)?p.lastSesAt:0;
  return out;
}
function load(){
  try{
    const raw=localStorage.getItem(storeKey());
    if(raw){
      const parsed=JSON.parse(raw);
      const antes=(parsed&&parsed.cfg&&parsed.cfg.mig)||0;
      S=hydrateProgress(parsed);
      /* grava o marcador na hora: sem isso a migração rodaria de novo na
         próxima carga e religaria o que o usuário tivesse desligado antes
         de qualquer save. */
      if(antes<CFG_MIG) save();
    }
    else if(!PROFILE){ migrateV1(); }          /* legado só existe no perfil anônimo */
    else { S=DEF(); }
  }catch(e){ console.warn('Progresso ilegível, iniciando novo.',e); S=DEF(); }
}
/* migração: a versão anterior guardava apenas o tema; nada é destruído */
function migrateV1(){
  S=DEF();
  try{
    const t=localStorage.getItem('rikai-theme');
    if(t) localStorage.setItem('bunpou-theme',t);
    if(localStorage.getItem('rikai-progress')){ S.hist.push({t:'migracao',d:Date.now()}); }
  }catch(e){}
  save();
}
/* O cache local é a garantia primária: grava sempre e primeiro. A nuvem é
   avisada depois, de forma assíncrona, e jamais bloqueia o estudo. */
function save(){
  try{ localStorage.setItem(storeKey(),JSON.stringify(S)); }
  catch(e){ toast('Não foi possível salvar o progresso.'); }
  try{ if(window.BunpouSync) window.BunpouSync.notifyLocalChange(); }catch(e){}
}
/* Uma "sessão" é um período de estudo, não um clique em Começar:
   runs encadeados dentro de 20 min contam como a mesma sessão, para que
   o domínio só suba quando a gramática sobrevive a momentos diferentes.
   A Sessão de Gramática obedece exatamente à mesma regra — não há atalho
   que force uma sessão nova, senão bastaria clicar duas vezes para simular
   recuperação em momentos distintos. */
function beginSession(){
  const now=Date.now();
  if(!S.lastSesAt||(now-S.lastSesAt)>SESSION_GAP) S.ses++;
  S.lastSesAt=now; save();
}
function rec(gid){
  if(!S.gp[gid]) S.gp[gid]={seen:0,ok:0,okH:0,bad:0,idk:0,dim:{rec:0,dif:0,man:0,pro:0},
                            ses:[],due:0,iv:1,last:0,used:[]};
  const r=S.gp[gid];
  if(!r.dim) r.dim={rec:0,dif:0,man:0,pro:0};
  if(!r.ses) r.ses=[]; if(!r.used) r.used=[];
  return r;
}

/* ---------- elegibilidade (fonte + alcance liberado) ---------- */
function unitOn(src,n){
  if(!S.cfg.src[src]) return false;
  const man=S.cfg.manual[src];
  if(Array.isArray(man)) return man.includes(n);
  return n<=(S.cfg.lim[src]||0);
}
function gpSources(g){ return g.src.filter(([s,u])=>SOURCES[s]&&unitInfo(s,u)); }
function gpEligible(g,ignoreKind){
  return g.src.some(([s,u])=>unitOn(s,u) && (ignoreKind||unitInfo(s,u).kind==='g'));
}
/* Pontos que as PROVAS habilitadas cobrem. Um ponto exclusivo de prova já entra
   por gpEligible (seu src é [['provas',n]]); o que este conjunto acrescenta são
   os pontos COMPARTILHADOS que uma questão de prova cobra mas que o currículo
   ainda não liberou — sem ele a questão da prova ficaria escondida. */
function provasGidSet(){
  const out=new Set();
  if(!S.cfg.src[SRC_PROVAS]) return out;
  ALLEX.forEach(x=>{ if(x.sx===SRC_PROVAS&&exSourceOn(x)) exGids(x).forEach(id=>out.add(id)); });
  return out;
}
/* Praticável AGORA = currículo liberado ∪ alcance das provas marcadas. É o
   conjunto que monta sessão, quick, Mini JLPT, fracos, top-up e etapa 5.
   A assimetria é deliberada: a prova libera a PRÓPRIA questão, nunca o acervo
   geral daquele ponto — quem garante isso é a guarda `curricular` de poolFor,
   que só dispensa atividades com sx:'provas'. */
function practiceGrammar(){
  const pv=provasGidSet();
  return GRAMMAR.filter(g=>(gpEligible(g)||pv.has(g.id))&&gpHasPractice(g.id));
}
function gpInSource(g,src){ return g.src.some(([s])=>s===src); }
/* Elegibilidade DENTRO de uma fonte. `gpEligible` é global: um ponto liberado
   pelo Rikai passaria mesmo com o tópico correspondente desligado no TRY, e
   "Praticar esta fonte" acabaria estudando o que aquela fonte não liberou. */
/* Liberação pelo CURRÍCULO, ignorando Provas antigas. É o que uma atividade
   que NÃO é de prova precisa ter: a fonte Provas libera as próprias questões,
   nunca o acervo geral de Rikai/NNK/TRY do mesmo ponto. */
function gpEligibleCurricular(gid){
  const g=GMAP[gid]; if(!g) return false;
  return g.src.some(([s,u])=>s!==SRC_PROVAS&&unitOn(s,u)&&unitInfo(s,u).kind==='g');
}
/* Ponto PRÓPRIO de Provas (src só [['provas',n]]) não tem currículo que o
   libere: sem esta exceção, a atividade autoral dele nunca entraria em sessão,
   Quick ou top-up. Ela segue a prova marcada que trouxe o ponto. Pontos
   compartilhados continuam exigindo o currículo — Provas não destrava o
   acervo geral de Rikai/NNK/TRY. */
function gpProvasOwnOn(gid){
  const g=GMAP[gid];
  return !!g&&g.src.length>0&&g.src.every(([s])=>s===SRC_PROVAS)&&!!S.cfg.src[SRC_PROVAS]&&gpEligible(g);
}
function gpEligibleIn(g,src){
  return g.src.some(([s,u])=>s===src&&unitOn(s,u)&&unitInfo(s,u).kind==='g');
}

/* ---------- estados de domínio ---------- */
const STATES=['novo','aprendendo','fraco','consolidando','forte','consolidado'];
const STATE_LABEL={novo:'Novo',aprendendo:'Em aprendizagem',fraco:'Fraco',
                   consolidando:'Em consolidação',forte:'Forte',consolidado:'Consolidado'};
function stateOf(gid){
  const r=S.gp[gid]; if(!r||!r.seen) return 'novo';
  const d=r.dim||{}, sess=(r.ses||[]).length;
  const unaided=r.ok, applied=(d.man||0)+(d.pro||0);
  const recentBad=r.last<0;
  /* fraco: erra mais do que acerta sozinho, ou errou da última vez após já ter visto bastante */
  if(r.bad+r.idk>=Math.max(2,unaided) || (recentBad&&unaided<2)) return 'fraco';
  if(unaided>=4 && sess>=3 && r.iv>=4 && applied>=1 && !recentBad) return 'consolidado';
  if(unaided>=3 && sess>=2 && applied>=1) return 'forte';
  if(unaided>=2 && sess>=1) return 'consolidando';
  return 'aprendendo';
}
function stateIdx(gid){ return STATES.indexOf(stateOf(gid)); }
function isDue(gid){ const r=S.gp[gid]; if(!r||!r.seen) return false; return (r.due||0)<=S.ses; }

/* ---------- registro de resultado + repetição espaçada ---------- */
/* res: 'ok' (sem ajuda) · 'guess' (chute) · 'bad' · 'idk'
   'hint' não é mais produzido (o botão de dica saiu); o ramo continua aceito
   por compatibilidade e é o mesmo do chute.                                 */
function applyResult(gid,res,skill,exId){
  const r=rec(gid); r.seen++;
  if(exId){ r.used.push(exId); if(r.used.length>60) r.used=r.used.slice(-60); }
  if(res==='ok'){
    r.ok++; r.last=1;
    if(skill&&r.dim[skill]!==undefined) r.dim[skill]++;
    if(!r.ses.includes(S.ses)) r.ses.push(S.ses);
    /* intervalo cresce 1→2→4→8→16 sessões; produção/manipulação valem
       um degrau extra, porque exigem recuperação sem pistas */
    const step=(skill==='pro'||skill==='man')?4:2;
    r.iv=Math.min(16,Math.max(1,Math.round(Math.max(1,r.iv)*step)));
    r.due=S.ses+r.iv;
  } else if(res==='hint'||res==='guess'){
    /* `guess` = acertou e DECLAROU que foi chute. Matematicamente idêntico a
       `hint` (mesma progressão conservadora, mesmo peso em weakScore via okH),
       mas semanticamente distinto: hint = ajuda ANTES da resposta, guess =
       acerto sem domínio assumido DEPOIS dela. O contador próprio preserva a
       distinção sem exigir mudança em weakScore(). */
    r.okH++; r.last=0.5;
    if(res==='guess') r.guess=(r.guess||0)+1;
    /* acerto com dica ou chute NÃO conta como domínio espontâneo */
    r.iv=Math.max(1,Math.min(2,Math.round(r.iv*0.75)||1));
    r.due=S.ses+r.iv;
  } else {
    if(res==='idk') r.idk++; else r.bad++;
    r.last=-1; r.iv=1; r.due=S.ses+1;
  }
  save();
}
function noteConfusion(expected,got){
  if(!expected||!got||expected===got) return;
  const k=expected+' × '+got;
  S.conf[k]=(S.conf[k]||0)+1; save();
}

/* ---------- seleção de exercícios ---------- */
/* Conjugação pura: o estímulo é uma palavra ISOLADA e a tarefa é só flexioná-la
   — os 160 itens gerados (forma て/る/た/ない e identificação de grupo, marcados
   com `gen`) e cinco escritas equivalentes (`conj:true`). O Bunpou Lab passa a
   focar gramática em contexto; essa prática o usuário faz em outro lugar.

   Os objetos CONTINUAM no banco: IDs, histórico e progresso já registrado ficam
   intactos. O que muda é a elegibilidade, e ela é cortada aqui — poolFor é o
   gargalo único por onde passam sessão, quick, top-up, etapa 5, prática de
   fonte/lição/ponto, Mini JLPT e altExercise. */
const isConjDrill=x=>!!(x.gen||x.conj);
/* Resposta ESCRITA: o usuário digita a resposta (lacuna aberta, transformação,
   correção, produção). A prova JLPT N5 não pede produção escrita — só escolha,
   ★並べかえ e texto com lacunas de escolha —, então esses formatos saem da
   prática pela MESMA porta que a conjugação mecânica. Os objetos continuam no
   banco: IDs, `acc`, `wr`, histórico e progresso registrados não mudam, e
   nada é convertido em múltipla escolha automaticamente. `order` não entra
   aqui: monta-se tocando os blocos, sem digitar. */
const WRITTEN_TYPES=['fill','short','trans','correct','prod'];
const isWrittenPractice=x=>WRITTEN_TYPES.includes(x.t);
/* Retiradas da prática pela auditoria de eficiência JLPT (quase duplicatas de
   outra atividade que cobra a mesma decisão). O objeto e o ID ficam. */
const PRACTICE_RETIRED=new Set(['x182']);
/* `order` (montar a frase inteira a partir da tradução) não corresponde a
   nenhuma tarefa da prova; a ordenação do JLPT é treinada pela ★. Os 14
   objetos, IDs e o histórico ficam; só deixam de ser sorteados. */
const INACTIVE_TYPES=['order'];
/* Gargalo único de elegibilidade de UMA atividade: tudo o que monta prática
   (poolFor) e tudo o que conta prática disponível passa por aqui. */
const isPracticable=x=>!isConjDrill(x)&&!isWrittenPractice(x)&&!INACTIVE_TYPES.includes(x.t)&&!PRACTICE_RETIRED.has(x.id);
/* Pontos cuja única prática era conjugação mecânica (ou resposta escrita) continuam visíveis como
   referência curricular, mas deixam de contar como pontos ATIVOS da prática.
   Isso evita fila vazia e impede que a barra de progresso da fonte fique
   eternamente abaixo de 100% por causa de conteúdo deliberadamente terceirizado. */
const gpHasPractice=gid=>(EXBY[gid]||[]).some(isPracticable);

/* A fonte da ATIVIDADE é verificada à parte da do ponto: uma atividade nascida
   da incorporação do TRY! não pode entrar no pool por causa de uma lição Rikai
   onde o mesmo ponto também é ensinado. Atividade sem `sx` = acervo geral.

   Não basta saber se a fonte está ligada: com 45 tópicos, o ALCANCE dentro
   dela importa. Os tópicos são derivados dos pontos que a atividade cobra
   (`exGids` → `src` → pares da fonte), sem duplicar metadata em 159 objetos.
   Um ponto que a fonte não cobre (ex.: だけ, que o TRY! atesta em cap.9 §1.16
   mas fora dos 45 itens numerados) não tem tópico a consultar — nesse caso
   decide só o interruptor da fonte. */
function exSrcUnitsByGid(x,sid){
  const per=[];
  exGids(x).forEach(gid=>{
    const g=GMAP[gid]; if(!g) return;
    const us=g.src.filter(([sc])=>sc===sid).map(([,u])=>u);
    if(us.length) per.push(us);
  });
  return per;
}
function exSourceOn(x){
  if(!x.sx) return true;
  const sid=x.sx;
  if(!S.cfg.src[sid]) return false;
  /* Provas não deriva a unidade dos grammar points: a prova de origem viaja na
     própria atividade, em `su`, e é ela que o interruptor por prova consulta.
     Um ponto próprio de Provas tem `src` [['provas',n]]; um ponto reusado do
     currículo não ganha entrada nenhuma — a questão segue presa à `su`. */
  /* `alt`: a MESMA questão reapareceu noutro conjunto — vale se qualquer um
     dos dois estiver marcado, sem cadastrar cópia. */
  if(sid===SRC_PROVAS) return unitOn(SRC_PROVAS,x.su)||(x.alt||[]).some(a=>unitOn(SRC_PROVAS,a.su));
  const per=exSrcUnitsByGid(x,sid);
  if(!per.length) return true;
  /* cloze cobra várias estruturas de uma vez: TODAS as que pertencem à fonte
     precisam estar liberadas, coerente com a regra de cloze do poolFor. */
  return x.t==='cloze' ? per.every(us=>us.some(u=>unitOn(sid,u)))
                       : per.some(us=>us.some(u=>unitOn(sid,u)));
}
/* Proveniência EXIBIDA na atividade, antes de responder. É informativa: não
   participa de elegibilidade, progresso, seleção nem repetição espaçada.
   `sx` (fonte específica da atividade) manda sozinho — uma questão nascida do
   TRY! não deve aparecer como "TRY + Rikai" só porque o ponto também existe no
   Rikai. Sem `sx`, a atividade é de acervo geral e mostra as fontes dos pontos
   que ela cobra, deduplicadas e na ordem canônica. */
function exSourceIds(x){
  if(x.sx) return SOURCES[x.sx]?[x.sx]:[];
  const set=new Set();
  exGids(x).forEach(gid=>{
    const g=GMAP[gid]; if(!g) return;
    g.src.forEach(([s])=>{ if(SOURCES[s]) set.add(s); });
  });
  return SRC_ORDER.filter(s=>set.has(s));
}
/* Métricas da fonte Provas: quantas provas estão marcadas e quantas questões
   delas estão disponíveis. O card da Home não traz barra de domínio porque a
   unidade aqui é a PROVA, não a lição; o domínio dos pontos que as provas
   cobrem aparece na tela de Progresso. */
function provasStats(){
  const units=UNITS[SRC_PROVAS]||[];
  const all=ALLEX.filter(x=>x.sx===SRC_PROVAS);
  /* Conta QUESTÕES, não objetos: um 文章の文法 é UMA atividade, mas vale uma
     questão por lacuna — é assim que a prova as numera, e é esse número que os
     rótulos prometem ao dizer "questões". */
  const qc=x=>x.t==='cloze'?((x.bl&&x.bl.length)||1):1;
  const soma=arr=>arr.reduce((a,x)=>a+qc(x),0);
  /* Disponível agora = a prova está marcada. A questão não depende mais de o
     currículo ter liberado a gramática que ela cobra. */
  const qOn=soma(all.filter(x=>exSourceOn(x)));
  return {total:units.length,
          on:units.filter(u=>unitOn(SRC_PROVAS,u.n)).length,
          q:soma(all), qOn,
          byUnit:units.map(u=>({u,n:soma(all.filter(x=>x.su===u.n||(x.alt||[]).some(a=>a.su===u.n))),on:unitOn(SRC_PROVAS,u.n)}))};
}
/* UMA origem por atividade. Responde “de onde esta atividade veio”, nunca
   “em quais fontes o ponto também aparece” — é por isso que não deriva de
   g.src. A localização vem: das unidades que o ponto ocupa NAQUELA fonte
   (intro/basico/try), da prova de origem (provas), ou é dispensada (lab). */
/* Pontos que a atividade REALMENTE cobra — mesma prioridade já usada para
   decidir a origem: `pg` manda; depois as lacunas de um cloze; depois o gid
   real; e só um contraste SEM `pg` expande para o grupo, porque aí a atividade
   cobra o contraste inteiro. Nunca `exGids` direto: isso abriria o grupo e
   apresentaria como conteúdo da atividade pontos que ela não cobra — era o que
   fazia x198 (pg:'de-causa') listar ので e から. */
function coverGids(x){
  const p=Array.isArray(x.pg)?x.pg:(x.pg?[x.pg]:[]);
  const exp=p.filter(id=>GMAP[id]);
  if(exp.length) return exp;
  if(x.gs) return x.gs.filter(id=>GMAP[id]);
  if(GMAP[x.g]) return [x.g];
  return exGids(x);
}
/* Associação que consta de g.src mas que a leitura do material NÃO confirmou
   como ponto ensinado naquela lição: すぎます aparece na lição 15 do Básico
   apenas como item de uma tabela de conjugação ない — o ponto da lição é
   V-ないでください. A associação continua em g.src (é inócua: sugiru já vale
   desde a lição 13), mas não é exibida como localização verificada. */
const LOC_NAO_CONFIRMADA={'sugiru|basico|15':1};
/* Localização por ATIVIDADE autoral, para quando ela cobra um uso específico
   do ponto que nem toda unidade de g.src ensina. Valor = unidades em que ESSE
   uso foi conferido no material ('fonte|unidade'); lista vazia = nenhuma
   unidade confirmada, e o popover omite “Onde estudar”. g.src não muda.
   x622  evento ＋ で: Intro Rikai lição 12 explica に (onde a coisa está) ×
         で (onde o evento acontece) — こくさいホールで えいがが あります.
         As lições 6 e 11 do Intro e a 1 do Básico tratam do で de ação.
   x629/x630  A は B より: o NNK 6 só ensina A の ほうが B より; a forma
         simples não foi encontrada em nenhuma fonte do projeto.
   x631  どう × どんな: Intro 11 ensina que どんな sempre vem com substantivo;
         Intro 17 ensina どう(でしたか) pedindo impressão — as duas metades da
         decisão. Nenhuma das duas ensina o contraste sozinha.
   x632  しっていますか → しりません: não encontrado nas fontes do projeto. */
const LOC_ATIVIDADE={x622:['intro|12'], x629:[], x630:[], x631:['intro|11','intro|17'], x632:[]};
function exOriginInfo(x){
  const o=x.og||(x.sx===SRC_PROVAS?'provas':(x.sx||null));
  const meta=o&&ORIGIN[o]; if(!meta) return null;
  const out={src:o,label:meta.label,name:meta.name,loc:''};
  if(o==='provas'){
    /* origem pelo CONJUNTO real (Practice Workbook 2012 ou a prova), com o
       número da questão; reaparições noutro conjunto vêm junto */
    const u=unitInfo(SRC_PROVAS,x.su);
    if(u.tag) out.label=u.tag; if(u.pt) out.name=u.pt;
    const alt=(x.alt||[]).map(a=>'também em '+(unitInfo(SRC_PROVAS,a.su).tag||a.exam)+' · '+a.qno);
    out.loc=[x.qno].concat(alt).filter(Boolean).join(' · ');
    return out;
  }
  if(o==='lab'){
    /* Origem é autoral, mas o CONTEÚDO tem onde ser estudado. São coisas
       diferentes e o popover as mostra separadas: nunca vira tag. */
    const own=Object.prototype.hasOwnProperty.call(LOC_ATIVIDADE,x.id);
    const vis=own?LOC_ATIVIDADE[x.id].slice():[];
    if(!own) coverGids(x).forEach(gid=>{ const g=GMAP[gid]; if(!g) return;
      g.src.forEach(([sc,u])=>{ if(!SOURCES[sc]) return;
        if(LOC_NAO_CONFIRMADA[gid+'|'+sc+'|'+u]) return;
        const c=sc+'|'+u; if(vis.indexOf(c)<0) vis.push(c); }); });
    out.cov=[];
    SRC_ORDER.forEach(sc=>vis.filter(c=>c.split('|')[0]===sc).forEach(c=>{
      const u=+c.split('|')[1], S0=SOURCES[sc], ui=unitInfo(sc,u);
      out.cov.push((ORIGIN[sc]?ORIGIN[sc].label:sc)+' · '+(S0?S0.unitWord:'Lição')+' '+u+(ui&&ui.jp?' — '+ui.jp:''));
    }));
    return out;
  }
  const us=[];
  coverGids(x).forEach(gid=>{ const g=GMAP[gid]; if(!g) return;
    g.src.forEach(([sc,u])=>{
      if(sc!==o||LOC_NAO_CONFIRMADA[gid+'|'+sc+'|'+u]) return;
      if(us.indexOf(u)<0) us.push(u); }); });
  us.sort((a,b)=>a-b);
  if(us.length){
    const S0=SOURCES[o], w=S0?S0.unitWord:'Lição';
    out.loc=us.map(u=>{ const ui=unitInfo(o,u); return w+' '+u+(ui&&ui.jp?' — '+ui.jp:''); }).join(' · ');
  }
  return out;
}
function poolFor(gids,filter){
  const set=new Set(gids);
  return ALLEX.filter(x=>{
    if(!isPracticable(x)) return false;   /* conjugação, resposta escrita, retiradas */
    if(!exSourceOn(x)) return false;
    /* Fonte escolhida explicitamente (“Praticar esta fonte” e “Praticar esta
       lição/tópico” são quem passa filter.src):
       uma atividade ESPECÍFICA de outra fonte (sx) não entra — sem isso uma
       `sx:'try'` de ponto compartilhado aparecia em "Fonte: Básico". Atividade
       geral (sem sx) segue compartilhada. É uma condição à parte de exSourceOn,
       que continua decidindo se a fonte da atividade está ligada/liberada. */
    if(filter&&filter.src&&x.sx&&x.sx!==filter.src) return false;
    /* sxOnly é mais estrito que src: exige que a atividade tenha NASCIDO da
       fonte. "Praticar esta fonte" inclui o acervo geral do ponto; a prática de
       Provas antigas não pode — só o material das provas entra nela. */
    if(filter&&filter.sxOnly&&x.sx!==filter.sxOnly) return false;
    const g=exGids(x);
    /* Um cloze cobra 4–5 estruturas de uma vez: só pode entrar se TODAS
       estiverem liberadas (fonte ativa + alcance liberado da fonte). Os
       demais tipos — inclusive contrastes — mantêm o comportamento
       histórico (basta UM ponto liberado). */
    /* ESCOPO — vale para toda atividade, inclusive as de prova. A seleção da
       sessão, do top-up, da etapa 5 e do Quick é feita PONTO A PONTO
       (poolFor([gid],…)), então sem isto uma questão de prova sobre ぐらい
       seria devolvida para qualquer ponto consultado. */
    if(x.t==='cloze'){ if(!g.length||!g.every(id=>set.has(id))) return false; }
    else if(!g.some(id=>set.has(id))) return false;
    /* LIBERAÇÃO — aqui mora a assimetria pedida: uma questão de prova depende
       apenas do interruptor da fonte e da prova (já conferidos em exSourceOn),
       mas uma atividade que não é de prova continua exigindo que o CURRÍCULO
       tenha liberado o ponto. Assim Provas antigas nunca destrava o acervo
       geral de Rikai/NNK/TRY. `filter.curricular` é posto por quem monta
       prática a partir de practiceGrammar(); um recorte explícito de pontos
       ("Praticar este ponto/lição/fonte") não o usa e segue como antes. */
    if(filter&&filter.curricular&&x.sx!==SRC_PROVAS&&!g.some(id=>gpEligibleCurricular(id)||gpProvasOwnOn(id))) return false;
    if(filter&&filter.types&&!filter.types.includes(x.t)) return false;
    if(filter&&filter.skills&&!filter.skills.includes(x.s)) return false;
    if(filter&&filter.contrastOnly&&!exIsContrast(x)) return false;
    return true;
  });
}
/* escolhe um exercício ainda não usado recentemente para aquele ponto */
function pickEx(pool,usedIds,rnd){
  if(!pool.length) return null;
  const fresh=pool.filter(x=>!usedIds.has(x.id));
  const src=fresh.length?fresh:pool;
  return src[Math.floor((rnd?rnd():Math.random())*src.length)];
}
function recentlyUsed(gid){ const r=S.gp[gid]; return new Set(r?r.used.slice(-8):[]); }

/* Estimativa INICIAL da fila. Inclui leitura, raciocínio e feedback — não só
   o clique/resposta. O relógio ativo abaixo é a proteção final contra uma
   estimativa individual ruim. Cloze continua sendo cobrado por lacuna. */
const COST={mc:55,fill:70,short:70,order:105,correct:105,trans:90,prod:140,star:115,cloze:55};
const costOf=x=>x.t==='cloze'?(50+COST.cloze*(x.bl?x.bl.length:4)):(COST[x.t]||80);

/* ---------- prioridade para pontos fracos ---------- */
function weakScore(gid){
  const r=S.gp[gid]; if(!r||!r.seen) return 0;
  let s=0;
  const d=r.dim||{};
  s+=r.bad*3+r.idk*3;                       /* erros recorrentes */
  s+=r.okH*1.5;                             /* acertou só com chute (ou dica, em registros antigos) */
  if((d.pro||0)===0&&GMAP[gid]&&GMAP[gid].prod) s+=2;      /* nunca produziu */
  if(isDue(gid)) s+=2;                      /* revisão vencida */
  if(r.last<0) s+=3;                        /* errou por último */
  const st=stateOf(gid);
  if(st==='fraco') s+=4; else if(st==='consolidado') s-=4; else if(st==='forte') s-=2;
  return s;
}
function weakList(limit){
  return practiceGrammar().map(g=>({g,sc:weakScore(g.id)}))
    .filter(o=>o.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,limit||30).map(o=>o.g);
}

/* ===================================================================
   MONTAGEM DA SESSÃO (15 / 30 / 45 / 60 MIN)
   5 etapas com orçamento de tempo, não com número fixo de questões.
   =================================================================== */
/* As cinco etapas existem em qualquer duração; muda só o orçamento de cada uma.
   Os filtros de tipo/habilidade são RÍGIDOS: uma etapa jamais aceita um formato
   que contrarie a sua finalidade, mesmo que sobre tempo. */
/* Sem resposta escrita (ver isWrittenPractice): as etapas 3 e 4, que antes
   eram Manipulação (trans/correct/fill) e Produção (prod), passam a Contexto
   (escolha em frases novas) e Ordenação ★ (★並べかえ). As chaves
   `k` ficam as mesmas — só 'rec', 'dif' e 'fix' têm lógica própria. */
const STAGES=[
 {k:'rec', n:'Recuperação',               d:'Você ainda lembra disso sem consultar?',
  skills:['rec','rcl','dif'], types:['mc']},
 {k:'dif', n:'Reconhecimento e contraste', d:'Estruturas parecidas misturadas — descubra qual cabe aqui.',
  skills:['dif','rec'], types:['mc'], contrast:true},
 {k:'man', n:'Contexto',                  d:'A mesma regra em frases e situações novas.',
  skills:['dif','rec'], types:['mc']},
 {k:'pro', n:'Ordenação ★',               d:'Monte a frase mentalmente e ache o fragmento da posição ★, como no ★並べかえ.',
  skills:['pro'], types:['star']},
 {k:'fix', n:'Erros e consolidação',      d:'O que escapou hoje, em outro contexto.',
  skills:null, types:null}
];
/* orçamento em minutos por etapa, na ordem de STAGES */
const SESSION_PRESETS={15:[3,4,2,4,2], 30:[5,7,5,8,5], 45:[7,11,7,12,8], 60:[10,15,10,15,10]};
const SESSION_DURATIONS=[{min:15,tag:'rápida'},{min:30,tag:'essencial'},
                         {min:45,tag:'reduzida'},{min:60,tag:'recomendado'}];
const sessionMin=()=>SESSION_PRESETS[S.cfg.sessionMin]?S.cfg.sessionMin:60;

/* Camadas de escolha de uma etapa, da mais desejável à menos — nenhuma delas
   escapa dos filtros da etapa. Se todas vierem vazias, o ponto é pulado. */
function stageTiers(st,gid){
  if(st.k==='dif') return [
    poolFor([gid],{contrastOnly:true,skills:['dif'],curricular:true}),   /* contraste explícito */
    poolFor([gid],{contrastOnly:true,types:st.types,curricular:true}),   /* qualquer contraste */
    poolFor([gid],{skills:['dif'],types:st.types,curricular:true}),      /* distinguir sem grupo */
    poolFor([gid],{skills:['rec'],types:st.types,curricular:true})       /* reconhecer em contexto */
  ];
  return [poolFor([gid],{skills:st.skills,types:st.types,curricular:true})];
}

/* `weakScore` mistura fraqueza, falta de produção e urgência num número só —
   por isso um ponto já acertado (score 2) passava à frente de um nunca visto
   (score 0). Em vez de mexer nesse número (que também alimenta progresso e
   repetição espaçada), a SELEÇÃO passa a separar as categorias.            */
function isUrgentPoint(gid){
  const r=S.gp[gid];
  if(!r||!r.seen) return false;                 /* nunca visto = categoria 2 */
  return isDue(gid)||r.last<0||stateOf(gid)==='fraco';
}
/* Ordem para as etapas 2–4: 1) devidos/fracos · 2) novos · 3) vistos e ainda
   não devidos (fallback, não deve dominar a sessão).                       */
function stageCandidates(st,elig,byUrgency,dueList,freshList){
  if(st.k==='rec') return (dueList.length?dueList:byUrgency).concat(freshList).slice(0,40);
  const seenIds=new Set();
  const push=(arr,g)=>{ if(!seenIds.has(g.id)){ seenIds.add(g.id); arr.push(g); } };
  const urgent=[],novos=[],resto=[];
  byUrgency.forEach(g=>{ if(isUrgentPoint(g.id)) push(urgent,g); });
  freshList.forEach(g=>push(novos,g));
  byUrgency.forEach(g=>{ if(!seenIds.has(g.id)) push(resto,g); });
  return urgent.concat(novos,resto).slice(0,40);
}
const GID_SOFT_CAP=2;   /* limite SUAVE de atividades do mesmo ponto por sessão */

function buildSession(opts){
  opts=opts||{};
  const elig=practiceGrammar();
  if(!elig.length) return null;
  const budgets=SESSION_PRESETS[opts.duration]||SESSION_PRESETS[60];
  const items=[]; const usedIds=new Set(); const perGid={};

  /* ordena por urgência: vencidos e fracos primeiro, novos entram na etapa 1 e 2 */
  const byUrgency=elig.slice().sort((a,b)=>weakScore(b.id)-weakScore(a.id));
  const due=byUrgency.filter(g=>isDue(g.id));
  const fresh=elig.filter(g=>!S.gp[g.id]||!S.gp[g.id].seen);

  STAGES.forEach((st,si)=>{
    let budget=(budgets[si]||0)*60;
    if(st.k==='fix'){ items.push({stage:si,placeholder:true,budget:budget}); return; }

    let cand=stageCandidates(st,elig,byUrgency,due,fresh);
    if(!cand.length) cand=elig.slice(0,30);
    if(!cand.length) return;

    /* percorre os pontos em rodízio; um ponto sem material adequado é PULADO,
       nunca substituído por um exercício de outro tipo. Para quando o orçamento
       acaba ou quando uma volta inteira não rende mais nada.
       `relax` libera o limite suave por gid quando uma volta inteira não rendeu
       nada — assim um due/erro importante nunca se perde por causa do teto.  */
    let i=0, misses=0, relax=false;
    while(budget>0 && misses<cand.length){
      const g=cand[i%cand.length]; i++;
      if(!relax&&(perGid[g.id]||0)>=GID_SOFT_CAP){ misses++;
        if(misses>=cand.length){ relax=true; misses=0; }
        continue; }
      const soft=new Set([...recentlyUsed(g.id),...usedIds]);
      let x=null;
      for(const tier of stageTiers(st,g.id)){
        /* Planeja até cruzar o orçamento uma vez: a última atividade pode
           ultrapassá-lo, pois nunca será interrompida. Durante a execução,
           o relógio ativo impede que as seguintes também sejam iniciadas. */
        const free=tier.filter(e=>!usedIds.has(e.id));
        if(!free.length) continue;
        x=pickEx(free,soft);
        if(x) break;
      }
      if(!x){ misses++;
        if(!relax&&misses>=cand.length){ relax=true; misses=0; }
        continue; }
      misses=0;
      usedIds.add(x.id);
      perGid[g.id]=(perGid[g.id]||0)+1;
      items.push({stage:si,ex:x,gid:g.id});
      budget-=costOf(x);
    }
  });
  /* tempo estimado real: a sessão é medida em minutos, não em nº de questões */
  const estSec=items.reduce((a,i)=>a+(i.ex?costOf(i.ex):(i.budget||0)),0);
  return {items,started:Date.now(),mode:opts.mode||'sessao',estSec,planMin:opts.duration||60,
          stageBudgetsSec:budgets.map(m=>m*60)};
}

/* sessão livre / mista / pontos fracos */
function buildPractice(opts){
  const elig=practiceGrammar();
  let gids;
  if(opts.mode==='weak'){ const w=weakList(24); gids=w.length?w.map(g=>g.id):elig.map(g=>g.id); }
  else if(opts.gids)     gids=opts.gids;
  else                   gids=elig.map(g=>g.id);
  if(!gids.length) return null;
  const filt={};
  if(opts.types&&opts.types.length) filt.types=opts.types;
  if(opts.skills&&opts.skills.length) filt.skills=opts.skills;
  if(opts.src) filt.src=opts.src;
  if(opts.sxOnly) filt.sxOnly=opts.sxOnly;
  if(!opts.gidStrict) filt.curricular=true;   /* recorte explícito de pontos não usa a guarda */
  let pool=poolFor(gids,filt);
  /* O fallback relaxa tipo/habilidade, como sempre fez. A fonte escolhida
     explicitamente é filtro DURO e segue junto: nunca "não achei, então vale
     qualquer fonte". Quem não passa `src` (sessão, quick, mista, fracos, ponto,
     Mini JLPT) cai no mesmo poolFor(gids,null) de antes. */
  if(!pool.length) pool=poolFor(gids,{src:opts.src,sxOnly:opts.sxOnly,curricular:!opts.gidStrict});
  if(!pool.length) return null;
  /* prioriza exercícios não vistos recentemente */
  const seen=new Set(); gids.forEach(g=>recentlyUsed(g).forEach(i=>seen.add(i)));
  const fresh=pool.filter(x=>!seen.has(x.id));
  let src=(fresh.length>=8?fresh:pool).slice();
  for(let i=src.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[src[i],src[j]]=[src[j],src[i]];}
  const n=Math.min(opts.count||20,src.length);
  /* teto opcional por tipo (o Mini JLPT limita 文章の文法 a 2). Percorre a
     lista já embaralhada e PULA o excedente, seguindo em frente — assim o
     conjunto continua chegando a n itens, sem repetir exercício. */
  let sel;
  if(opts.max){
    sel=[]; const usados={};
    for(const x of src){
      if(sel.length>=n) break;
      const teto=opts.max[x.t];
      if(teto!=null){
        usados[x.t]=usados[x.t]||0;
        if(usados[x.t]>=teto) continue;
        usados[x.t]++;
      }
      sel.push(x);
    }
  } else sel=src.slice(0,n);
  const items=sel.map(x=>({stage:-1,ex:x,gid:primaryGids(x)[0]}));
  const estSec=items.reduce((a,i)=>a+costOf(i.ex),0);
  return {items,started:Date.now(),mode:opts.mode||'livre',estSec};
}

/* escolhe OUTRO exercício do mesmo ponto (nunca a mesma frase).
   cloze fica de fora: a repescagem é um retorno rápido a UM ponto,
   e um texto multi-lacuna traria junto gramáticas que não falharam. */
function altExercise(gid,avoidId){
  /* “Outro exemplo” de verdade: fica de fora não só o exercício atual, mas tudo
     que já pertence à sessão (apresentado ou reservado). Antes a escolha podia
     cair num exercício já usado — não chegava a repetir, porque a etapa 5 o
     descartava na materialização, mas a repescagem daquele ponto se perdia. */
  const inRun=new Set(V.run?V.run.items.filter(i=>i.ex).map(i=>i.ex.id):[]);
  const pool=poolFor([gid],{curricular:true}).filter(x=>x.id!==avoidId&&!inRun.has(x.id)&&x.t!=='cloze');
  if(!pool.length) return null;
  /* prefere um ID que não esteja entre os recentes deste ponto; se TODOS
     forem recentes, ainda devolve um — a revisão do ponto não pode ser
     bloqueada só porque o material dele é pouco. avoidId já saiu do pool. */
  return pickEx(pool,recentlyUsed(gid))||pool[0];
}

/* ---------- correção ---------- */
/* ---- ordenação: apresentação embaralhada + distratores -------------------
   `tk` continua sendo a sequência CANÔNICA (resposta). `dist` traz blocos
   plausíveis que NÃO entram na frase. O aluno vê tudo junto e embaralhado,
   mas os índices de V.ans sempre apontam para este pool estável.          */
function ordTokens(ex){ return ex.dist&&ex.dist.length?ex.tk.concat(ex.dist):ex.tk; }
/* Ordem de exibição sorteada UMA vez por tentativa e guardada só em memória.
   Sem isto, `tk` era mostrado na própria ordem da resposta — bastava clicar
   da esquerda para a direita. */
function orderView(ex){
  if(V.ordViewFor===ex.id&&Array.isArray(V.ordView)) return V.ordView;
  const pool=ordTokens(ex), k=ex.tk.length;
  const canon=pool.map((t,i)=>i);
  let view=canon.slice();
  for(let attempt=0;attempt<16;attempt++){
    const v=canon.slice();
    for(let i=v.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[v[i],v[j]]=[v[j],v[i]];}
    /* recusa o sorteio em que os blocos corretos já saem na ordem correta */
    const seq=v.filter(i=>i<k);
    if(!seq.every((val,idx)=>val===idx)){ view=v; break; }
    view=v;                                   /* nunca fica em laço infinito */
  }
  V.ordView=view; V.ordViewFor=ex.id;
  return view;
}
/* ★並べかえ: mesma ideia de orderView. Nas ★ autorais `tk` costumava estar na
   ordem da frase — os botões 1–4 entregavam a resposta. A ordem de EXIBIÇÃO é
   sorteada uma vez por questão e guardada só em memória; V.ans continua sendo
   o índice ORIGINAL em `tk`, então a correção (x.ord[x.star]) não muda.
   As ★ de Provas antigas mantêm a ordem de alternativas da prova real. */
function starView(ex){
  const canon=ex.tk.map((t,i)=>i);
  if(ex.sx===SRC_PROVAS) return canon;
  if(V.starViewFor===ex.id&&Array.isArray(V.starView)) return V.starView;
  const same=(a,b)=>a.every((v,i)=>v===b[i]);
  let view=canon.slice();
  for(let attempt=0;attempt<24;attempt++){
    const v=canon.slice();
    for(let i=v.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[v[i],v[j]]=[v[j],v[i]];}
    view=v;
    /* recusa a ordem do array e a ordem da frase */
    if(!same(v,canon)&&!same(v,ex.ord)) break;
  }
  V.starView=view; V.starViewFor=ex.id;
  return view;
}
/* `pre`/`post` das ★ de prova trazem <br> entre as falas do diálogo; o resto
   continua escapado. */
const starText=s=>esc(s||'').replace(/&lt;br\s*\/?&gt;/gi,'<br>');
function orderWrongWhy(x){
  const pool=ordTokens(x), a=V.ans||[], k=x.tk.length;
  const extra=a.filter(i=>i>=k).map(i=>pool[i]);
  if(extra.length) return 'Você usou um bloco que não entra nesta frase: '+extra.join(' / ')+'.';
  const falta=[]; for(let i=0;i<k;i++) if(a.indexOf(i)<0) falta.push(pool[i]);
  if(falta.length) return 'Faltou usar: '+falta.join(' / ')+'.';
  return 'Os blocos escolhidos estão certos; o que ainda não está é a ordem entre eles.';
}
function gradeAnswer(ex,ans){
  if(ans==null||ans==='') return {ok:false,empty:true};
  if(ex.t==='mc') return {ok:ans===ex.a, chosen:ex.o[ans]};
  /* cloze: cada lacuna vale por si. `parts` guarda o veredicto individual;
     `ok` global só serve para os consumidores antigos e exige tudo certo. */
  if(ex.t==='cloze'){
    const a=ans||[];
    const parts=ex.bl.map((b,i)=>({
      ok: a[i]===b.a,
      chosen: (a[i]==null?null:b.o[a[i]]),
      expected: b.o[b.a]
    }));
    const score=parts.filter(p=>p.ok).length;
    return {ok:score===parts.length, parts, score, total:parts.length,
            chosen:score+'/'+parts.length};
  }
  /* ★並べかえ: a resposta é QUAL fragmento cai na posição marcada. */
  if(ex.t==='star'){
    const right=ex.ord[ex.star];
    return {ok:ans===right, chosen:ex.tk[ans], expected:ex.tk[right]};
  }
  if(ex.t==='order'){
    const pool=ordTokens(ex);
    const built=(ans||[]).map(i=>pool[i]).join('');
    /* a comparação é contra a frase canônica: isso já rejeita distrator
       incluído, bloco necessário ausente e ordem trocada. */
    return {ok:acceptMatch(built,ex.acc), chosen:built};
  }
  const ok=acceptMatch(ans,ex.acc);
  let res={ok,chosen:String(ans)};
  if(!ok && S.cfg.romaji && ex.accR && acceptMatch(ans,ex.accR)) res={ok:true,chosen:String(ans),romaji:true};
  return res;
}
function expectedText(ex){
  if(ex.t==='mc') return ex.o[ex.a];
  if(ex.t==='order') return ex.acc[0];
  if(ex.t==='star') return starSentence(ex);
  if(ex.t==='cloze') return ex.bl.map((b,i)=>(i+1)+'. '+b.o[b.a]).join(' · ');
  return (ex.acc&&ex.acc[0])||'';
}
/* frase completa de um ★並べかえ, na ordem correta.
   `full` traz a frase com a separação natural do japonês; a junção dos
   fragmentos é só o fallback (partícula solta ficaria separada do nome). */
function starSentence(ex){
  return ex.full||((ex.pre||'')+ex.ord.map(i=>ex.tk[i]).join(' ')+(ex.post||''));
}
/* ===================================================================
   INTERFACE
   =================================================================== */
const app=document.getElementById('app');
let V={view:'home',src:null,run:null,i:0,ans:null,graded:null,
       sessionLog:[],requeue:[],clock:0,activeMs:0,clockLast:0,clockCounting:false,timer:null,
       stageStarted:{},stageVisited:{},softEnding:false,topUps:0,guessSnap:null,ordView:null,ordViewFor:null,starView:null,starViewFor:null,nav:[],settingsReturn:null};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2300);}
let _mOk=null;
function openModal(title,body,okLabel,cb,cancelLabel){
  document.getElementById('mTitle').textContent=title;
  document.getElementById('mBody').textContent=body;
  document.getElementById('mOk').textContent=okLabel;
  document.getElementById('mCancel').textContent=cancelLabel||'Cancelar';
  _mOk=cb; document.getElementById('overlay').classList.add('show');
  /* O pulso vem DEPOIS de o modal ficar visível, nunca antes: assim ele
     credita o tempo até este instante com a contagem ainda ligada e só então
     lê o estado novo, desligando-a. Fechar a conta antes de mostrar o modal
     deixaria clockCounting=true — e um app suspenso logo em seguida somaria
     o intervalo inteiro com o modal aberto. */
  clockPulse();
}
function closeModal(){
  document.getElementById('overlay').classList.remove('show');
  /* Mesma ordem ao fechar: o tempo de modal aberto é creditado com a contagem
     desligada (soma zero, nunca é recuperado depois) e a contagem recomeça
     a partir deste instante, sem depender do próximo tique de 500 ms. */
  clockPulse();
}
document.getElementById('mOk').addEventListener('click',()=>{closeModal();if(_mOk)_mOk();});
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal();});
/* o popover de conta fecha ao clicar fora ou com Esc; cliques dentro dele
   param a propagação, e a navegação o fecha em go() */
document.addEventListener('click',()=>{ if(V.acctOpen){V.acctOpen=false;render();} });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&V.acctOpen){e.preventDefault();V.acctOpen=false;render();} });
/* Atalhos 1..N para escolher alternativa. Só SELECIONAM, pelo mesmo pick() do
   clique — quem envia continua sendo Responder/Enter. Valem só onde há UM
   conjunto numerável: mc (A–D) e star (rotulado 1–4). Cloze tem várias
   lacunas por tela e order monta sequência: ficam de fora. Nada acontece com
   foco em campo de texto, IME compondo, modal, popover, tentativa já corrigida
   ou fora da tela de atividade. */
document.addEventListener('keydown',e=>{
  if(e.isComposing||e.keyCode===229) return;
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(!/^[1-9]$/.test(e.key)) return;
  const t=e.target;
  if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable)) return;
  if(V.view!=='run'||!V.run||V.graded||V.acctOpen) return;
  if(document.querySelector('.overlay.show')) return;
  const it=cur(); if(!it||!it.ex) return;
  const x=it.ex, n=x.t==='mc'?x.o.length:(x.t==='star'?x.tk.length:0), i=+e.key-1;
  if(!n||i>=n) return;
  e.preventDefault();
  pick(x.t==='star'?starView(x)[i]:i);
});
/* Enter na tela de atividade.

   ANTES da correção, numa questão de alternativas (mc ou ★) com uma opção já
   escolhida — por clique ou pelas teclas 1–4 —, Enter faz o mesmo que o botão
   Responder (submit()). Sem opção escolhida, não faz nada: não responde, não
   marca “Não sei”, não avança. Campos de texto (fill) continuam com o ansKey
   próprio, e o cloze não muda. Se o foco estiver num botão que NÃO é
   alternativa (Responder, Não sei, Encerrar), o clique nativo do botão age.

   DEPOIS da correção, Enter segue a ação PRINCIPAL da tela: o mesmo next() do
   botão, que já sabe se leva a outra questão ou aos resultados. Nunca vira
   atalho de Chutei.

   Tecla mantida pressionada (e.repeat) não age: sem isso, segurar Enter
   corrigiria e já pularia a questão. O Enter que ENVIA uma resposta escrita
   não avança na mesma tecla: ansKey chama preventDefault antes do submit, e
   aqui eventos com defaultPrevented são ignorados. */
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.defaultPrevented) return;
  if(e.isComposing||e.keyCode===229) return;
  if(e.ctrlKey||e.metaKey||e.altKey||e.shiftKey) return;
  if(V.view!=='run'||!V.run||V.acctOpen) return;
  if(document.querySelector('.overlay.show')) return;
  const t=e.target;
  if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable)) return;
  if(!V.graded){
    const it=cur(), x=it&&it.ex;
    if(!x||(x.t!=='mc'&&x.t!=='star')||V.ans==null) return;
    if(e.repeat){ e.preventDefault(); return; }
    if(t&&t.tagName==='BUTTON'&&!(t.classList&&t.classList.contains('opt'))) return;
    e.preventDefault();
    submit();
    return;
  }
  e.preventDefault();
  if(e.repeat) return;
  next();
});
