function importProgressFile(input){
  const f=input.files&&input.files[0]; if(!f) return;
  if(f.size>8*1024*1024){ toast('Arquivo grande demais.'); return; }
  const rd=new FileReader();
  rd.onload=()=>{
    let data;
    try{ data=JSON.parse(String(rd.result)); }
    catch(e){ toast('Arquivo inválido: não é JSON.'); return; }
    const prog=data&&data.progress;
    if(!data||data.format!=='bunpou-lab-backup'||!prog||typeof prog!=='object'||Array.isArray(prog)){
      toast('Arquivo não é um backup do Bunpou Lab.'); return;
    }
    const pts=Object.keys(prog.gp||{}).length;
    openModal('Substituir o progresso atual?',
      `O backup traz ${pts} ponto(s) com histórico e ${(prog.hist||[]).length} sessão(ões). `+
      'O progresso atual deste perfil será substituído.',
      'Importar',()=>{ S=hydrateProgress(prog); save(); toast('Progresso importado.'); goHome(); });
  };
  rd.readAsText(f);
}

/* O módulo de sync chama a ponte a cada mudança de status (Pendente →
   Sincronizando → Sincronizado), ~2 s depois de cada resposta. Um render()
   completo refaz TODO o DOM: se isso cai entre pressionar e soltar um botão,
   o elemento sob o cursor é destruído e o clique se perde — o “precisei
   clicar duas vezes” em Continuar/Chutei. Fora de Ajustes (única tela cujo
   corpo mostra o estado de sync) basta trocar o controle de conta e o aviso
   de login, sem tocar nos botões da atividade. Sem .acct-wrap no DOM (pintura
   antes de o módulo carregar) cai no render completo. */
function refreshAuthChrome(){
  const wrap=app.querySelector('.acct-wrap');
  if(V.view==='config'||!wrap){ render(); return; }
  clockPulse();
  const tmp=document.createElement('div');
  tmp.innerHTML=acctControl();
  if(tmp.firstElementChild) wrap.replaceWith(tmp.firstElementChild); else wrap.remove();
  const note=document.getElementById('authnote');
  if(note){ tmp.innerHTML=authNoteHtml(); if(tmp.firstElementChild) note.replaceWith(tmp.firstElementChild); }
}

/* ---------- ROTEADOR ---------- */
function render(){
  /* Fecha a conta do relógio no INSTANTE da transição. Toda pausa voluntária
     (mudar de view, abrir o popover, abrir um modal) chega aqui, e o pulso
     credita o tempo com a flag anterior antes que o novo estado valha. Sem
     isso, uma pausa aberta logo antes de o navegador suspender os timers só
     seria registrada no pulso seguinte — que pode vir 20 minutos depois. */
  clockPulse();
  let html='';
  switch(V.view){
    case 'home':     html=renderHome();break;
    case 'source':   html=renderSource();break;
    case 'unit':     html=renderUnit();break;
    case 'run':      html=renderRun();break;
    case 'results':  html=renderResults();break;
    case 'progress': html=renderProgress();break;
    case 'config':   html=renderConfig();break;
    case 'quick':    html=renderQuick();break;
    case 'rikai':    html=renderRikai();break;
    default:         html=renderHome();
  }
  app.innerHTML=topbar()+html;
  const inp=document.getElementById('inp');
  if(inp&&!V.graded){ inp.focus(); try{inp.setSelectionRange(inp.value.length,inp.value.length);}catch(e){} }
}
load();
render();

/* ===================================================================
   Ponte para o módulo de autenticação/sincronização (src/auth-sync.js).
   O app não conhece Identity nem banco: só expõe o mínimo para que a
   camada de persistência troque de perfil e substitua o snapshot.
   =================================================================== */
window.BunpouApp={
  /* snapshot pedagógico corrente (o objeto S), sem nada de autenticação */
  getState:()=>S,
  /* Troca o perfil ativo e recarrega o cache correspondente.
     Só aceita null (anônimo deliberado) ou um id string não vazio: um id
     inválido NÃO pode ser silenciosamente interpretado como logout, senão a
     conta passaria a gravar sobre o perfil anônimo. */
  useProfile(userId){
    if(userId!==null&&!(typeof userId==='string'&&userId.length)){
      console.error('[bunpou] useProfile: identificador inválido; perfil mantido.',userId);
      return false;
    }
    PROFILE=userId; load(); render(); return true;
  },
  activeProfile:()=>PROFILE,
  storageKeyFor:uid=>storeKey(uid),
  /* substitui o estado corrente por um snapshot (nuvem, backup ou migração) */
  replaceState(raw,opts){
    S=hydrateProgress(raw);
    try{ localStorage.setItem(storeKey(),JSON.stringify(S)); }catch(e){}
    if(!opts||!opts.silent) render();
  },
  /* grava sem notificar a sincronização — evita eco ao aplicar dado remoto */
  writeLocalOnly(){ try{ localStorage.setItem(storeKey(),JSON.stringify(S)); }catch(e){} },
  hydrate:raw=>hydrateProgress(raw),
  defaults:()=>DEF(),
  /* "progresso significativo": critério conservador para decidir se vale
     perguntar ao usuário antes de importar o perfil anônimo numa conta nova */
  isSignificant(p){
    const s=p||S,d=DEF();
    if((s.ses||0)>0) return true;
    if(Object.keys(s.gp||{}).length>0) return true;
    if((s.hist||[]).length>0) return true;
    return JSON.stringify(s.cfg||{})!==JSON.stringify(d.cfg);
  },
  render:()=>refreshAuthChrome(),
  toast:m=>toast(m),
  modal:(t,b,ok,cb,cancel)=>openModal(t,b,ok,cb,cancel)
};
window.dispatchEvent(new Event('bunpou-app-ready'));
</script>
<script type="module" src="/src/auth-sync.js"></script>
